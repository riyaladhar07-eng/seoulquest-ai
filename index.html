<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SeoulQuest AI</title>

<link rel="manifest" href="manifest.json">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(to bottom,#020617,#0f172a,#111827);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
position:relative;
}

/* SKYLINE */
.skyline{
position:absolute;
bottom:0;
width:200%;
height:160px;
background:linear-gradient(to right,#1e293b,#0f172a);
opacity:0.3;
animation:move 25s linear infinite;
}

@keyframes move{
0%{transform:translateX(0);}
100%{transform:translateX(-50%);}
}

/* PARTICLES */
.particle{
position:absolute;
width:5px;
height:5px;
background:#38bdf8;
border-radius:50%;
opacity:0.6;
animation:float 10s linear infinite;
}

@keyframes float{
0%{transform:translateY(100vh);}
100%{transform:translateY(-100vh);}
}

/* GAME */
#game{
position:relative;
z-index:2;
width:90%;
max-width:750px;
background:rgba(15,23,42,0.95);
padding:25px;
border-radius:25px;
text-align:center;
border:1px solid #334155;
}

/* TITLE */
h1{
color:#38bdf8;
font-size:40px;
}

/* GUIDE */
#avatar{
background:#111827;
padding:12px;
border-radius:15px;
margin-bottom:15px;
border:1px solid #334155;
}

/* TEXT */
#level,#xp,#badge,#map{
margin:8px;
}

/* QUESTION */
#question{
font-size:24px;
margin:20px 0;
}

/* OPTIONS */
.option{
display:block;
width:100%;
padding:14px;
margin:10px 0;
background:#1e293b;
border:none;
border-radius:12px;
color:white;
font-size:16px;
cursor:pointer;
}

.option:hover{
background:#2563eb;
}

/* RESULT */
#result{
margin-top:10px;
font-size:20px;
height:30px;
}

</style>

</head>

<body>

<div class="skyline"></div>

<!-- particles -->
<div class="particle" style="left:10%"></div>
<div class="particle" style="left:30%"></div>
<div class="particle" style="left:50%"></div>
<div class="particle" style="left:70%"></div>
<div class="particle" style="left:90%"></div>

<div id="game">

<h1>🎮 SeoulQuest AI</h1>

<div id="avatar">
🤖 <b>Riya AI Guide:</b><br>
Welcome to your AI Korean adventure 🇰🇷
</div>

<div id="map">📍 Seoul Station</div>
<div id="level">Level 1</div>
<div id="xp">XP: 0</div>
<div id="badge">🏅 Beginner</div>

<div id="question"></div>
<div id="options"></div>
<div id="result"></div>

</div>

<script>

/* INSTALL PWA */
if('serviceWorker' in navigator){
navigator.serviceWorker.register('sw.js');
}

/* DATA */
let xp = 0;
let level = 1;
let index = 0;

/* 50+ QUESTIONS SYSTEM */
const levels = {

1:[
{q:"Hello in Korean?",o:["안녕하세요","사랑","물","책"],a:"안녕하세요"},
{q:"Thank you?",o:["감사합니다","학교","버스","의자"],a:"감사합니다"},
{q:"Goodbye?",o:["안녕","고양이","강","달"],a:"안녕"},
{q:"Love?",o:["사랑","물","책","차"],a:"사랑"},
{q:"Friend?",o:["친구","의자","버스","강"],a:"친구"}
],

2:[
{q:"School?",o:["학교","강","달","불"],a:"학교"},
{q:"Teacher?",o:["선생님","학생","강아지","책"],a:"선생님"},
{q:"Student?",o:["학생","고양이","버스","사과"],a:"학생"},
{q:"Book?",o:["책","물","차","불"],a:"책"},
{q:"Coffee?",o:["커피","우유","달","강"],a:"커피"}
],

3:[
{q:"Water?",o:["물","밥","차","불"],a:"물"},
{q:"Rice?",o:["밥","책","강","달"],a:"밥"},
{q:"Milk?",o:["우유","버스","강","책"],a:"우유"},
{q:"Bus?",o:["버스","기차","비행기","배"],a:"버스"},
{q:"Train?",o:["기차","버스","차","달"],a:"기차"}
]

};

/* LOAD */
function load(){

let q = levels[level][index];

document.getElementById("question").innerText = q.q;

let html = "";

q.o.forEach(op=>{
html += `<button class="option" onclick="check('${op}')">${op}</button>`;
});

document.getElementById("options").innerHTML = html;

}

/* CHECK */
function check(ans){

let q = levels[level][index];

if(ans === q.a){
xp += 10;
document.getElementById("result").innerText = "✅ Correct +10 XP";
}else{
document.getElementById("result").innerText = "❌ Wrong";
}

index++;

if(index >= levels[level].length){
index = 0;
level++;
}

update();
load();

}

/* UPDATE UI */
function update(){

document.getElementById("xp").innerText = "XP: " + xp;
document.getElementById("level").innerText = "Level: " + level;

let badge = "🏅 Beginner";
if(level >= 3) badge = "🥈 Explorer";
if(level >= 5) badge = "🥇 Master";

document.getElementById("badge").innerText = badge;

}

update();
load();

</script>

</body>
</html>
