<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeoulQuest AI</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(to bottom,#020617,#0f172a,#111827);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
position:relative;
}

/* SKYLINE */
.skyline{
position:absolute;
bottom:0;
width:200%;
height:160px;
background:linear-gradient(to right,#1e293b,#0f172a);
opacity:0.3;
animation:move 25s linear infinite;
}

@keyframes move{
0%{transform:translateX(0);}
100%{transform:translateX(-50%);}
}

/* PARTICLES */
.particle{
position:absolute;
width:5px;
height:5px;
background:#38bdf8;
border-radius:50%;
opacity:0.6;
animation:float 10s linear infinite;
}

@keyframes float{
0%{transform:translateY(100vh);}
100%{transform:translateY(-100vh);}
}

/* GAME BOX */
#game{
position:relative;
z-index:2;
width:90%;
max-width:750px;
background:rgba(15,23,42,0.95);
padding:25px;
border-radius:25px;
text-align:center;
border:1px solid #334155;
}

/* TITLE */
h1{
color:#38bdf8;
font-size:40px;
}

/* GUIDE */
#avatar{
background:#111827;
padding:12px;
border-radius:15px;
margin-bottom:15px;
border:1px solid #334155;
}

/* TEXT */
#level,#xp,#badge,#map{
margin:8px;
}

/* QUESTION */
#question{
font-size:24px;
margin:20px 0;
}

/* OPTIONS */
.option{
display:block;
width:100%;
padding:14px;
margin:10px 0;
background:#1e293b;
border:none;
border-radius:12px;
color:white;
font-size:16px;
cursor:pointer;
}

.option:hover{
background:#2563eb;
}

/* RESULT */
#result{
margin-top:10px;
font-size:20px;
height:30px;
}

</style>
</head>

<body>

<div class="skyline"></div>

<div id="game">

<h1>🎮 SeoulQuest AI</h1>

<div id="avatar">
🤖 <b>Riya AI Guide:</b><br>
Let’s learn Korean and explore Seoul 🇰🇷
</div>

<div id="map">📍 Seoul Station</div>
<div id="level">Level 1</div>
<div id="xp">XP: 0</div>
<div id="badge">🏅 Beginner</div>

<div id="question"></div>
<div id="options"></div>
<div id="result"></div>

</div>

<script>

/* XP + LEVEL */
let xp = 0;
let level = 1;

/* LEVEL WISE QUESTIONS (FIXED ISSUE) */
const levels = {

1:[
{q:"What is Hello?",o:["안녕하세요","사랑","학교","물"],a:"안녕하세요"},
{q:"What is Thank You?",o:["감사합니다","책","의자","달"],a:"감사합니다"}
],

2:[
{q:"What is School?",o:["학교","차","강","불"],a:"학교"},
{q:"What is Friend?",o:["친구","바다","눈","산"],a:"친구"}
],

3:[
{q:"What is Water?",o:["물","사과","기차","버스"],a:"물"},
{q:"What is Love?",o:["사랑","고양이","커피","의자"],a:"사랑"}
]

};

let currentLevel = 1;
let index = 0;

/* LOAD QUESTION */
function load(){

let q = levels[currentLevel][index];

document.getElementById("question").innerText = q.q;

let html = "";

q.o.forEach(op=>{
html += `<button class="option" onclick="check('${op}')">${op}</button>`;
});

document.getElementById("options").innerHTML = html;

}

/* CHECK ANSWER */
function check(ans){

let q = levels[currentLevel][index];

if(ans === q.a){

xp += 10;
speak(q.a);

document.getElementById("result").innerText =
"✅ Correct +10 XP";

}else{

document.getElementById("result").innerText =
"❌ Wrong";

}

update();

/* NEXT */
index++;

if(index >= levels[currentLevel].length){
index = 0;
currentLevel++;
level++;
}

load();

}

/* UI UPDATE */
function update(){

document.getElementById("xp").innerText = "XP: " + xp;
document.getElementById("level").innerText = "Level: " + level;

if(xp < 50){
document.getElementById("badge").innerText = "🏅 Beginner";
}else if(xp < 100){
document.getElementById("badge").innerText = "🥈 Explorer";
}else{
document.getElementById("badge").innerText = "🥇 Master";
}

}

/* KOREAN AI VOICE */
function speak(text){

let msg = new SpeechSynthesisUtterance(text);
msg.lang = "ko-KR";
msg.rate = 0.8;

let voices = speechSynthesis.getVoices();
let korean = voices.find(v=>v.lang.includes("ko"));

if(korean){
msg.voice = korean;
}

speechSynthesis.speak(msg);

}

load();
update();

</script>

</body>
</html>
