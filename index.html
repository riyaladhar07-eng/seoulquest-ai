<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SeoulQuest AI</title>

<link rel="manifest" href="manifest.json">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(to bottom,#020617,#0f172a,#111827);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
position:relative;
}

.skyline{
position:absolute;
bottom:0;
width:200%;
height:160px;
background:linear-gradient(to right,#1e293b,#0f172a);
opacity:0.3;
animation:move 25s linear infinite;
}

@keyframes move{
0%{transform:translateX(0);}
100%{transform:translateX(-50%);}
}

#game{
position:relative;
z-index:2;
width:90%;
max-width:750px;
background:rgba(15,23,42,0.95);
padding:25px;
border-radius:25px;
text-align:center;
border:1px solid #334155;
}

h1{
color:#38bdf8;
}

#avatar{
background:#111827;
padding:12px;
border-radius:15px;
margin-bottom:15px;
border:1px solid #334155;
}

.option{
display:block;
width:100%;
padding:14px;
margin:10px 0;
background:#1e293b;
border:none;
border-radius:12px;
color:white;
cursor:pointer;
}

.option:hover{
background:#2563eb;
}

#result{
margin-top:10px;
font-size:18px;
}

</style>

</head>

<body>

<div class="skyline"></div>

<div id="game">

<h1>🎮 SeoulQuest AI</h1>

<div id="avatar">
🤖 Riya Guide: Learn Korean & Explore Seoul 🇰🇷
</div>

<div id="level"></div>
<div id="xp"></div>

<div id="question"></div>
<div id="options"></div>
<div id="result"></div>

</div>

<script>

/* PWA */
if('serviceWorker' in navigator){
navigator.serviceWorker.register('sw.js');
}

/* DATA */
let xp = 0;
let level = 1;
let index = 0;
let bossMode = false;

/* QUESTIONS */
const levels = {
1:[
{q:"Hello?",o:["안녕하세요","사랑","물","책"],a:"안녕하세요"},
{q:"Thank you?",o:["감사합니다","학교","버스","의자"],a:"감사합니다"}
],
2:[
{q:"School?",o:["학교","강","달","불"],a:"학교"},
{q:"Friend?",o:["친구","고양이","버스","강"],a:"친구"}
],
3:[
{q:"Water?",o:["물","밥","차","불"],a:"물"},
{q:"Love?",o:["사랑","책","버스","강"],a:"사랑"}
]
};

/* BOSS */
const bossQuestions = [
{
q:"🔥 Boss: I want to go to Seoul",
o:["서울 가고 싶어요","학교 갑니다","물 주세요","친구 없어요"],
a:"서울 가고 싶어요"
}
];

/* LOAD */
function load(){

let q;

if(bossMode){
q = bossQuestions[0];
}else{
q = levels[level][index];
}

document.getElementById("question").innerText = q.q;

let html = "";

q.o.forEach(op=>{
html += `<button class="option" onclick="check('${op}')">${op}</button>`;
});

document.getElementById("options").innerHTML = html;

updateUI();

}

/* CHECK */
function check(ans){

let q = bossMode ? bossQuestions[0] : levels[level][index];

if(ans === q.a){

xp += bossMode ? 30 : 10;

document.getElementById("result").innerText =
bossMode ? "🔥 BOSS DEFEATED +30 XP" : "✅ Correct";

speak(q.a);

/* boss exit */
if(bossMode){
bossMode = false;
}

/* trigger boss */
if(index === 1){
bossMode = true;
}

}else{
document.getElementById("result").innerText = "❌ Wrong";
}

index++;

if(index >= levels[level].length){
index = 0;
level++;
}

load();

}

/* UI */
function updateUI(){

document.getElementById("level").innerText = "Level: " + level;
document.getElementById("xp").innerText = "XP: " + xp;

}

/* VOICE */
function speak(text){

let msg = new SpeechSynthesisUtterance(text);
msg.lang = "ko-KR";
msg.rate = 0.8;
speechSynthesis.speak(msg);

}

load();

</script>

<!-- PWA CONNECT -->
<script>
if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
