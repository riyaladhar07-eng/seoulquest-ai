<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SeoulQuest AI PRO</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(to bottom,#020617,#0f172a,#000);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.game{
width:92%;
max-width:800px;
background:rgba(15,23,42,0.95);
padding:20px;
border-radius:20px;
text-align:center;
border:1px solid #334155;
}

h1{color:#38bdf8;}

.btn{
display:block;
width:100%;
margin:10px 0;
padding:12px;
background:#1e293b;
border:none;
color:white;
border-radius:10px;
cursor:pointer;
}

.btn:hover{background:#2563eb;}

.topbar{
display:flex;
justify-content:space-between;
font-size:14px;
margin-bottom:10px;
}

.map{
margin:10px 0;
padding:8px;
background:#111827;
border-radius:10px;
}

.boss{
color:#ff3b3b;
font-weight:bold;
}

</style>
</head>

<body>

<div class="game">

<h1>🎮 SeoulQuest AI PRO</h1>

<div class="topbar">
<div>XP: <span id="xp">0</span></div>
<div>Level: <span id="level">1</span></div>
<div>Stage: <span id="stage">Station</span></div>
</div>

<div class="map" id="map">📍 Seoul Station Zone</div>

<div id="question"></div>

<div id="options"></div>

<div id="result"></div>

<div style="margin-top:10px;">
<button class="btn" onclick="toggleMusic()">🎵 Music ON/OFF</button>
</div>

</div>

<script>

/* ================= MUSIC ================= */
let music = false;

function toggleMusic(){
music = !music;
alert(music ? "Music ON (add mp3 later)" : "Music OFF");
}

/* ================= SAVE ================= */
let xp = localStorage.getItem("xp") || 0;
xp = parseInt(xp);

let level = Math.floor(xp/50)+1;

/* ================= BOSSES ================= */
const bosses = [
"🔥 Boss 1: Seoul Guard",
"🔥 Boss 2: Language Demon",
"🔥 Final Boss: King of Seoul"
];

/* ================= MAP ================= */
function updateMap(){
if(level < 3) document.getElementById("stage").innerText = "Station";
else if(level < 6) document.getElementById("stage").innerText = "City";
else document.getElementById("stage").innerText = "Palace";
}

/* ================= AI QUESTIONS ================= */
function gen(){

const words = [
["Hello","안녕하세요"],
["Thank you","감사합니다"],
["Friend","친구"],
["Love","사랑"],
["School","학교"],
["Book","책"],
["Water","물"],
["Food","음식"],
["Bus","버스"],
["Train","기차"],
["City","도시"],
["Korea","한국"],
["Seoul","서울"],
["Game","게임"],
["Study","공부"],
["Music","음악"]
];

let w = words[Math.floor(Math.random()*words.length)];

let wrong = words
.filter(x=>x[1]!=w[1])
.sort(()=>Math.random()-0.5)
.slice(0,3)
.map(x=>x[1]);

let options = [...wrong,w[1]]
.sort(()=>Math.random()-0.5);

return {q:`What is "${w[0]}" in Korean?`,o:options,a:w[1]};
}

/* ================= GAME ================= */
let current;

function load(){

current = gen();

document.getElementById("question").innerText = current.q;

let html="";

current.o.forEach(op=>{
html+=`<button class="btn" onclick="check('${op}')">${op}</button>`;
});

document.getElementById("options").innerHTML=html;

document.getElementById("xp").innerText=xp;
document.getElementById("level").innerText=Math.floor(xp/50)+1;

updateMap();

}

/* ================= CHECK ================= */
function check(ans){

if(ans===current.a){

xp+=10;
localStorage.setItem("xp",xp);

document.getElementById("result").innerText="✅ Correct +10 XP";

if(xp%100===0){
alert(bosses[Math.floor(xp/100)%3]);
}

}else{
document.getElementById("result").innerText="❌ Wrong";
}

load();

}

load();

</script>

</body>
</html>
