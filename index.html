<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeoulQuest AI</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(to bottom,#020617,#0f172a,#000);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.game{
width:92%;
max-width:800px;
background:rgba(15,23,42,0.95);
padding:20px;
border-radius:20px;
text-align:center;
border:1px solid #334155;
}

h1{color:#38bdf8;}

.top{
display:flex;
justify-content:space-between;
font-size:14px;
margin:10px 0;
}

.btn{
display:block;
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
cursor:pointer;
}

.btn:hover{
background:#2563eb;
}

#box{
margin-top:10px;
}

#result{
margin-top:10px;
min-height:20px;
color:#67e8f9;
}
</style>
</head>

<body>

<div class="game">

<h1>🎮 SeoulQuest AI</h1>

<div class="top">
<div>XP: <span id="xp">0</span></div>
<div>Level: <span id="level">1</span></div>
<div>Energy: <span id="energy">100</span></div>
</div>

<h3>🎭 Role Play Mode</h3>

<div id="box"></div>

<div id="result"></div>

</div>

<script>

let xp=0;
let energy=100;
let currentScenario="";

/* ================= SCENARIOS ================= */

const scenarios={

airport:{
q:"✈️ You arrive in Korea. How do you say: 'Hello'?",
options:["안녕하세요","감사합니다","학교","사랑"],
answer:"안녕하세요"
},

restaurant:{
q:"🍜 You want food. How do you say 'Thank you'?",
options:["감사합니다","안녕하세요","집","물"],
answer:"감사합니다"
},

friend:{
q:"👋 You meet a Korean friend. How do you say 'I am a student'?",
options:["저는 학생입니다","나는 밥","서울","친구"],
answer:"저는 학생입니다"
},

shopping:{
q:"🛍️ In a shop, how do you say 'Hello'?",
options:["안녕하세요","사랑","학교","물"],
answer:"안녕하세요"
}

};

/* ================= LOAD MENU ================= */

function menu(){

document.getElementById("box").innerHTML=`

<button class="btn" onclick="start('airport')">✈️ Airport</button>
<button class="btn" onclick="start('restaurant')">🍜 Restaurant</button>
<button class="btn" onclick="start('friend')">👋 Meet Friend</button>
<button class="btn" onclick="start('shopping')">🛍️ Shopping</button>

`;

}

function start(type){

currentScenario=type;

let s=scenarios[type];

let html=`<h3>${s.q}</h3>`;

s.options.forEach(op=>{
html+=`<button class="btn" onclick="check('${op}')">${op}</button>`;
});

document.getElementById("box").innerHTML=html;
document.getElementById("result").innerText="";

}

/* ================= CHECK ================= */

function check(ans){

let correct=scenarios[currentScenario].answer;

if(ans===correct){

xp+=10;
document.getElementById("result").innerText="✅ Correct +10 XP";

}else{

energy-=10;
document.getElementById("result").innerText="❌ Wrong -10 Energy";

}

update();

/* back to menu */
setTimeout(menu,1200);

}

/* ================= UI ================= */

function update(){

document.getElementById("xp").innerText=xp;
document.getElementById("level").innerText=Math.floor(xp/50)+1;
document.getElementById("energy").innerText=energy;

}

/* START */
menu();
update();

</script>

</body>
</html>
