
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeoulQuest AI</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(to bottom,#020617,#0f172a,#111827);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

/* CYBERPUNK GLOW */

body::before{
content:"";
position:absolute;
width:600px;
height:600px;
background:#38bdf8;
filter:blur(180px);
opacity:0.15;
top:-100px;
left:-100px;
}

body::after{
content:"";
position:absolute;
width:500px;
height:500px;
background:#f472b6;
filter:blur(180px);
opacity:0.12;
bottom:-100px;
right:-100px;
}

/* GAME */

#game{
position:relative;
z-index:2;
width:92%;
max-width:750px;
background:rgba(17,24,39,0.95);
padding:25px;
border-radius:25px;
border:1px solid #334155;
box-shadow:0 0 40px rgba(56,189,248,0.3);
text-align:center;
}

/* TITLE */

h1{
font-size:42px;
color:#38bdf8;
margin-bottom:10px;
text-shadow:0 0 15px #38bdf8;
}

/* LEVEL */

#level{
font-size:20px;
color:#f472b6;
margin-bottom:10px;
}

/* XP */

#xp{
font-size:18px;
margin-bottom:15px;
}

/* MAP */

#map{
margin-bottom:15px;
font-size:18px;
color:#facc15;
}

/* PROGRESS */

#progressContainer{
width:100%;
height:20px;
background:#1e293b;
border-radius:20px;
overflow:hidden;
margin-bottom:25px;
}

#progressBar{
height:100%;
width:0%;
background:linear-gradient(to right,#38bdf8,#0ea5e9);
transition:0.5s;
}

/* QUESTION */

#question{
font-size:26px;
margin-bottom:25px;
line-height:1.5;
}

/* OPTIONS */

.option{
display:block;
width:100%;
padding:15px;
margin:12px 0;
border:none;
border-radius:16px;
font-size:17px;
font-weight:bold;
cursor:pointer;
background:#1e293b;
color:white;
transition:0.3s;
border:1px solid #334155;
}

.option:hover{
transform:scale(1.03);
background:#2563eb;
box-shadow:0 0 20px rgba(37,99,235,0.5);
}

/* RESULT */

#result{
height:35px;
font-size:22px;
font-weight:bold;
margin-top:15px;
}

/* NEXT BUTTON */

#nextBtn{
margin-top:20px;
padding:14px 28px;
border:none;
border-radius:15px;
background:linear-gradient(135deg,#38bdf8,#0ea5e9);
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
display:none;
}

#nextBtn:hover{
transform:scale(1.05);
}

/* ANIMATIONS */

.correct{
color:#22c55e;
animation:pop 0.4s ease;
}

.wrong{
color:#ef4444;
animation:shake 0.4s ease;
}

@keyframes pop{
0%{transform:scale(0.8);}
100%{transform:scale(1);}
}

@keyframes shake{
0%{transform:translateX(-5px);}
25%{transform:translateX(5px);}
50%{transform:translateX(-5px);}
75%{transform:translateX(5px);}
100%{transform:translateX(0);}
}

</style>
</head>

<body>

<div id="game">

<h1>🎮 SeoulQuest AI</h1>

<div id="map">📍 Seoul Station District</div>

<div id="level">Level 1</div>

<div id="xp">XP: 0</div>

<div id="progressContainer">
<div id="progressBar"></div>
</div>

<div id="question"></div>

<div id="options"></div>

<div id="result"></div>

<button id="nextBtn" onclick="nextQuestion()">Next ➜</button>

<audio id="correctSound">
<source src="https://assets.mixkit.co/sfx/preview/mixkit-video-game-win-2016.mp3">
</audio>

<audio id="wrongSound">
<source src="https://assets.mixkit.co/sfx/preview/mixkit-player-losing-or-failing-2042.mp3">
</audio>

</div>

<script>

let xp = 0;
let level = 1;
let currentQuestion = 0;

const questions = [

{
question:"What is 'Hello' in Korean?",
options:["감사합니다","안녕하세요","사랑","학교"],
answer:"안녕하세요"
},

{
question:"What is 'Thank You' in Korean?",
options:["물","감사합니다","고양이","친구"],
answer:"감사합니다"
},

{
question:"What is 'Book' in Korean?",
options:["책","강","산","커피"],
answer:"책"
},

{
question:"What is 'Love' in Korean?",
options:["달","해","사랑","자동차"],
answer:"사랑"
},

{
question:"What is 'Friend' in Korean?",
options:["친구","학교","음악","의자"],
answer:"친구"
},

{
question:"What is 'School' in Korean?",
options:["사과","강아지","학교","기차"],
answer:"학교"
},

{
question:"What is 'Rice/Food' in Korean?",
options:["물","밥","우유","차"],
answer:"밥"
},

{
question:"What is 'Water' in Korean?",
options:["물","커피","고기","눈"],
answer:"물"
},

{
question:"What is 'Teacher' in Korean?",
options:["학생","선생님","친구","형제"],
answer:"선생님"
},

{
question:"What is 'Student' in Korean?",
options:["선생님","학생","아기","가족"],
answer:"학생"
},

{
question:"What is 'Dog' in Korean?",
options:["강아지","고양이","새","물고기"],
answer:"강아지"
},

{
question:"What is 'Cat' in Korean?",
options:["강아지","호랑이","고양이","사자"],
answer:"고양이"
},

{
question:"What is 'Coffee' in Korean?",
options:["차","우유","커피","물"],
answer:"커피"
},

{
question:"What is 'Milk' in Korean?",
options:["커피","우유","밥","사과"],
answer:"우유"
},

{
question:"What is 'Apple' in Korean?",
options:["사과","바나나","포도","딸기"],
answer:"사과"
},

{
question:"What is 'Banana' in Korean?",
options:["사과","딸기","바나나","포도"],
answer:"바나나"
},

{
question:"What is 'Train' in Korean?",
options:["자동차","버스","기차","비행기"],
answer:"기차"
},

{
question:"What is 'Bus' in Korean?",
options:["버스","기차","배","자동차"],
answer:"버스"
},

{
question:"What is 'Computer' in Korean?",
options:["전화기","컴퓨터","게임","인터넷"],
answer:"컴퓨터"
},

{
question:"What is 'Music' in Korean?",
options:["영화","게임","음악","사진"],
answer:"음악"
}

];

function loadQuestion(){

document.getElementById("result").innerHTML = "";
document.getElementById("nextBtn").style.display = "none";

let q = questions[currentQuestion];

document.getElementById("question").innerHTML = q.question;

let optionsHTML = "";

q.options.forEach(option => {

optionsHTML += `
<button class="option" onclick="checkAnswer('${option}')">
${option}
</button>
`;

});

document.getElementById("options").innerHTML = optionsHTML;

}

function checkAnswer(selected){

let correctAnswer = questions[currentQuestion].answer;

if(selected === correctAnswer){

xp += 10;

document.getElementById("correctSound").play();

document.getElementById("result").innerHTML =
"✅ Correct! +10 XP";

document.getElementById("result").className = "correct";

}else{

document.getElementById("wrongSound").play();

document.getElementById("result").innerHTML =
"❌ Wrong Answer";

document.getElementById("result").className = "wrong";

}

document.getElementById("xp").innerHTML =
"XP: " + xp;

let progress = (xp % 100);

document.getElementById("progressBar").style.width =
progress + "%";

if(xp >= level * 50){

level++;

document.getElementById("level").innerHTML =
"Level " + level;

changeMap();

}

document.getElementById("nextBtn").style.display =
"inline-block";

}

function nextQuestion(){

currentQuestion++;

if(currentQuestion >= questions.length){
currentQuestion = 0;
}

loadQuestion();

}

function changeMap(){

let maps = [
"📍 Seoul Station District",
"🌆 Gangnam Neon City",
"🎓 Korea University Zone",
"🛍️ Myeongdong Market",
"🌃 Han River Night Route"
];

let mapIndex = (level - 1) % maps.length;

document.getElementById("map").innerHTML =
maps[mapIndex];

}

loadQuestion();

</script>

</body>
</html>
