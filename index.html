<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeoulQuest AI - Real Korean Learning</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.app{
width:90%;
max-width:900px;
background:#0f172a;
padding:20px;
border-radius:16px;
border:1px solid #1e293b;
}

h1{color:#38bdf8;text-align:center}

.top{
display:flex;
justify-content:space-between;
font-size:14px;
margin-bottom:10px;
}

.card{
background:#111827;
padding:15px;
border-radius:12px;
margin-top:10px;
}

button{
padding:10px;
margin:5px;
width:100%;
border:none;
border-radius:8px;
background:#1e293b;
color:white;
cursor:pointer;
}

button:hover{background:#2563eb}

.progress{
height:10px;
background:#1e293b;
border-radius:10px;
overflow:hidden;
margin-top:10px;
}

.fill{
height:100%;
width:0%;
background:#38bdf8;
}
</style>
</head>

<body>

<div class="app">

<h1>🇰🇷 SeoulQuest AI (Real Korean Learning Engine)</h1>

<div class="top">
<div>XP: <span id="xp">0</span></div>
<div>Level: <span id="level">1</span></div>
<div>Correct: <span id="correct">0</span></div>
</div>

<div class="card">
<div id="question">Select a mode</div>
<div id="options"></div>
<div id="result"></div>

<div class="progress"><div class="fill" id="bar"></div></div>
</div>

<button onclick="setMode('daily')">🌍 Daily Life Korean</button>
<button onclick="setMode('restaurant')">🍜 Restaurant</button>
<button onclick="setMode('travel')">✈️ Travel</button>
<button onclick="setMode('shopping')">🛍️ Shopping</button>

</div>

<script>

let xp=0;
let correct=0;
let mode="daily";
let currentAnswer="";

/* ================= REAL SENTENCE BANK (NO REPETITION) ================= */

const data = {

daily:[
{
q:"How do you say: 'Nice to meet you, I am a student'?",
a:"만나서 반갑습니다 저는 학생입니다",
o:[
"만나서 반갑습니다 저는 학생입니다",
"저는 배고파요",
"학교 갑니다",
"책 읽어요"
]
},
{
q:"How do you say: 'I am learning Korean'?",
a:"저는 한국어를 배우고 있습니다",
o:[
"저는 한국어를 배우고 있습니다",
"물 주세요",
"음식 맛있어요",
"친구 만나요"
]
}
],

restaurant:[
{
q:"You want to politely ask for food",
a:"음식 좀 주세요",
o:[
"음식 좀 주세요",
"학교 갑니다",
"책 있어요",
"나는 학생입니다"
]
},
{
q:"How do you say 'This is delicious'?",
a:"이거 정말 맛있어요",
o:[
"이거 정말 맛있어요",
"안녕하세요",
"저는 친구입니다",
"공부합니다"
]
}
],

travel:[
{
q:"At airport: ask where gate is",
a:"탑승구가 어디예요",
o:[
"탑승구가 어디예요",
"책 읽어요",
"음식 주세요",
"친구 만나요"
]
},
{
q:"How do you say 'I want to go to Seoul'?",
a:"서울에 가고 싶어요",
o:[
"서울에 가고 싶어요",
"학교입니다",
"물 주세요",
"맛있어요"
]
}
],

shopping:[
{
q:"Ask price politely",
a:"이거 얼마예요",
o:[
"이거 얼마예요",
"저는 학생입니다",
"친구 만나요",
"학교 갑니다"
]
},
{
q:"Say 'I want to buy this'",
a:"이거 사고 싶어요",
o:[
"이거 사고 싶어요",
"물 주세요",
"책 읽어요",
"안녕하세요"
]
}
]

};

/* ================= MODE ================= */

function setMode(m){
mode=m;
load();
}

/* ================= LOAD ================= */

function load(){

let item=data[mode][Math.floor(Math.random()*data[mode].length)];

currentAnswer=item.a;

document.getElementById("question").innerText=item.q;

let html="";
item.o.forEach(op=>{
html+=`<button onclick="check('${op}')">${op}</button>`;
});

document.getElementById("options").innerHTML=html;
}

/* ================= CHECK ================= */

function check(ans){

if(ans===currentAnswer){
xp+=10;
correct++;
document.getElementById("result").innerText="✅ Correct +10 XP";
}else{
document.getElementById("result").innerText="❌ Try again";
}

update();
load();
}

/* ================= UPDATE ================= */

function update(){

document.getElementById("xp").innerText=xp;
document.getElementById("correct").innerText=correct;
document.getElementById("level").innerText=Math.floor(xp/50)+1;

document.getElementById("bar").style.width=(xp%50)*2+"%";
}

load();
update();

</script>

</body>
</html>
