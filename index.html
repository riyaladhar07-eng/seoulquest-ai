<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeoulQuest AI Ultimate</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(to bottom,#020617,#0f172a,#111827);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
position:relative;
}

/* SKYLINE */

.skyline{
position:absolute;
bottom:0;
width:200%;
height:180px;
background:url('https://i.imgur.com/Z8mJf6A.png') repeat-x;
background-size:contain;
opacity:0.18;
animation:moveSkyline 30s linear infinite;
}

@keyframes moveSkyline{
0%{
transform:translateX(0);
}
100%{
transform:translateX(-50%);
}
}

/* PARTICLES */

.particle{
position:absolute;
width:6px;
height:6px;
background:#38bdf8;
border-radius:50%;
opacity:0.5;
animation:float 10s linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh) translateX(0);
opacity:0;
}
50%{
opacity:0.6;
}
100%{
transform:translateY(-100vh) translateX(100px);
opacity:0;
}
}

/* GLOW */

body::before{
content:"";
position:absolute;
width:600px;
height:600px;
background:#38bdf8;
filter:blur(180px);
opacity:0.12;
top:-150px;
left:-150px;
}

body::after{
content:"";
position:absolute;
width:500px;
height:500px;
background:#f472b6;
filter:blur(180px);
opacity:0.1;
bottom:-150px;
right:-150px;
}

/* GAME */

#game{
position:relative;
z-index:2;
width:92%;
max-width:760px;
background:rgba(15,23,42,0.92);
padding:25px;
border-radius:28px;
border:1px solid #334155;
box-shadow:0 0 40px rgba(56,189,248,0.25);
text-align:center;
backdrop-filter:blur(10px);
}

/* TITLE */

h1{
font-size:42px;
color:#38bdf8;
text-shadow:0 0 18px #38bdf8;
margin-bottom:10px;
}

/* GUIDE */

#avatar{
background:#111827;
padding:15px;
border-radius:18px;
margin-bottom:20px;
border:1px solid #334155;
font-size:16px;
line-height:1.6;
}

/* LEVEL */

#level{
font-size:20px;
color:#f472b6;
margin-bottom:10px;
}

#xp{
font-size:18px;
margin-bottom:10px;
}

#badge{
font-size:18px;
margin-bottom:15px;
color:#facc15;
}

#map{
margin-bottom:15px;
font-size:18px;
color:#38bdf8;
}

/* PROGRESS */

#progressContainer{
width:100%;
height:20px;
background:#1e293b;
border-radius:20px;
overflow:hidden;
margin-bottom:25px;
}

#progressBar{
height:100%;
width:0%;
background:linear-gradient(to right,#38bdf8,#0ea5e9);
transition:0.5s;
}

/* QUESTION */

#question{
font-size:26px;
margin-bottom:25px;
line-height:1.5;
}

/* OPTIONS */

.option{
display:block;
width:100%;
padding:15px;
margin:12px 0;
border:none;
border-radius:16px;
font-size:17px;
font-weight:bold;
cursor:pointer;
background:#1e293b;
color:white;
transition:0.3s;
border:1px solid #334155;
}

.option:hover{
transform:scale(1.03);
background:#2563eb;
box-shadow:0 0 20px rgba(37,99,235,0.5);
}

/* RESULT */

#result{
height:35px;
font-size:22px;
font-weight:bold;
margin-top:15px;
}

/* BUTTON */

#nextBtn{
margin-top:20px;
padding:14px 28px;
border:none;
border-radius:15px;
background:linear-gradient(135deg,#38bdf8,#0ea5e9);
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
display:none;
}

#nextBtn:hover{
transform:scale(1.05);
}

/* ANIMATION */

.correct{
color:#22c55e;
animation:pop 0.4s ease;
}

.wrong{
color:#ef4444;
animation:shake 0.4s ease;
}

@keyframes pop{
0%{transform:scale(0.8);}
100%{transform:scale(1);}
}

@keyframes shake{
0%{transform:translateX(-5px);}
25%{transform:translateX(5px);}
50%{transform:translateX(-5px);}
75%{transform:translateX(5px);}
100%{transform:translateX(0);}
}

</style>
</head>

<body>

<div class="skyline"></div>

<div class="particle" style="left:10%; animation-delay:0s;"></div>
<div class="particle" style="left:25%; animation-delay:2s;"></div>
<div class="particle" style="left:40%; animation-delay:4s;"></div>
<div class="particle" style="left:60%; animation-delay:1s;"></div>
<div class="particle" style="left:75%; animation-delay:3s;"></div>
<div class="particle" style="left:90%; animation-delay:5s;"></div>

<div id="game">

<h1>🎮 SeoulQuest AI</h1>

<div id="avatar">
🤖 <b>Riya AI Guide:</b><br>
Welcome back, explorer! Learn Korean and conquer Seoul 🚀
</div>

<div id="map">📍 Seoul Station District</div>

<div id="level">Level 1</div>

<div id="xp">XP: 0</div>

<div id="badge">🏅 Beginner Explorer</div>

<div id="progressContainer">
<div id="progressBar"></div>
</div>

<div id="question"></div>

<div id="options"></div>

<div id="result"></div>

<button id="nextBtn" onclick="nextQuestion()">Next ➜</button>

</div>

<script>

let xp = localStorage.getItem("xp")
? parseInt(localStorage.getItem("xp"))
: 0;

let level = localStorage.getItem("level")
? parseInt(localStorage.getItem("level"))
: 1;

let currentQuestion = 0;

/* SPEAK KOREAN */

function speakKorean(text){

let speech = new SpeechSynthesisUtterance(text);

speech.lang = "ko-KR";

speech.rate = 0.9;

window.speechSynthesis.speak(speech);

}

/* QUESTIONS */

const questions = [

{
question:"What is 'Hello' in Korean?",
options:["감사합니다","안녕하세요","사랑","학교"],
answer:"안녕하세요"
},

{
question:"What is 'Thank You' in Korean?",
options:["물","감사합니다","고양이","친구"],
answer:"감사합니다"
},

{
question:"What is 'Love' in Korean?",
options:["달","해","사랑","자동차"],
answer:"사랑"
},

{
question:"What is 'Friend' in Korean?",
options:["친구","학교","음악","의자"],
answer:"친구"
},

{
question:"What is 'Water' in Korean?",
options:["물","커피","우유","차"],
answer:"물"
},

{
question:"What is 'School' in Korean?",
options:["사과","학교","기차","자동차"],
answer:"학교"
}

];

function updateUI(){

document.getElementById("xp").innerHTML =
"XP: " + xp;

document.getElementById("level").innerHTML =
"Level " + level;

let progress = xp % 100;

document.getElementById("progressBar").style.width =
progress + "%";

let badge = "🏅 Beginner Explorer";

if(level >= 3){
badge = "🥈 Seoul Challenger";
}

if(level >= 5){
badge = "🥇 Korean Master";
}

if(level >= 8){
badge = "👑 Seoul Legend";
}

document.getElementById("badge").innerHTML = badge;

let maps = [
"📍 Seoul Station District",
"🌆 Gangnam Neon City",
"🎓 Korea University Zone",
"🛍️ Myeongdong Market",
"🌃 Han River Night Route"
];

document.getElementById("map").innerHTML =
maps[(level - 1) % maps.length];

}

function loadQuestion(){

document.getElementById("result").innerHTML = "";
document.getElementById("nextBtn").style.display = "none";

let q = questions[currentQuestion];

document.getElementById("question").innerHTML =
q.question;

let optionsHTML = "";

q.options.forEach(option => {

optionsHTML += `
<button class="option"
onclick="checkAnswer('${option}')">
${option}
</button>
`;

});

document.getElementById("options").innerHTML =
optionsHTML;

}

function checkAnswer(selected){

let correctAnswer = questions[currentQuestion].answer;

if(selected === correctAnswer){

xp += 10;

speakKorean(correctAnswer);

document.getElementById("result").innerHTML =
"✅ Correct! +10 XP";

document.getElementById("result").className =
"correct";

}else{

document.getElementById("result").innerHTML =
"❌ Wrong Answer";

document.getElementById("result").className =
"wrong";

}

if(xp >= level * 50){
level++;
}

localStorage.setItem("xp", xp);
localStorage.setItem("level", level);

updateUI();

document.getElementById("nextBtn").style.display =
"inline-block";

}

function nextQuestion(){

currentQuestion++;

if(currentQuestion >= questions.length){
currentQuestion = 0;
}

loadQuestion();

}

updateUI();
loadQuestion();

</script>

</body>
</html>
