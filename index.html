<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeoulQuest AI</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(to bottom,#020617,#0f172a,#111827);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
position:relative;
}

/* SKYLINE */
.skyline{
position:absolute;
bottom:0;
width:200%;
height:160px;
background:linear-gradient(to right,#1e293b,#0f172a);
opacity:0.3;
animation:move 25s linear infinite;
}

@keyframes move{
0%{transform:translateX(0);}
100%{transform:translateX(-50%);}
}

/* PARTICLES */
.particle{
position:absolute;
width:5px;
height:5px;
background:#38bdf8;
border-radius:50%;
opacity:0.6;
animation:float 10s linear infinite;
}

@keyframes float{
0%{transform:translateY(100vh);}
100%{transform:translateY(-100vh);}
}

/* GAME BOX */
#game{
position:relative;
z-index:2;
width:90%;
max-width:750px;
background:rgba(15,23,42,0.95);
padding:25px;
border-radius:25px;
text-align:center;
border:1px solid #334155;
}

/* TITLE */
h1{
color:#38bdf8;
font-size:40px;
}

/* GUIDE */
#avatar{
background:#111827;
padding:12px;
border-radius:15px;
margin-bottom:15px;
border:1px solid #334155;
}

/* TEXT */
#level,#xp,#badge,#map{
margin:8px;
}

/* QUESTION */
#question{
font-size:24px;
margin:20px 0;
}

/* OPTIONS */
.option{
display:block;
width:100%;
padding:14px;
margin:10px 0;
background:#1e293b;
border:none;
border-radius:12px;
color:white;
font-size:16px;
cursor:pointer;
}

.option:hover{
background:#2563eb;
}

/* RESULT */
#result{
margin-top:10px;
font-size:20px;
height:30px;
}

/* BOSS STYLE */
.boss{
color:#f97316;
font-weight:bold;
text-shadow:0 0 10px #f97316;
}

</style>
</head>

<body>

<div class="skyline"></div>

<div class="particle" style="left:10%"></div>
<div class="particle" style="left:30%"></div>
<div class="particle" style="left:50%"></div>
<div class="particle" style="left:70%"></div>
<div class="particle" style="left:90%"></div>

<div id="game">

<h1>🎮 SeoulQuest AI</h1>

<div id="avatar">
🤖 <b>Riya AI Guide:</b><br>
Prepare for Korean challenges 🚀
</div>

<div id="map">📍 Seoul Station</div>
<div id="level">Level 1</div>
<div id="xp">XP: 0</div>
<div id="badge">🏅 Beginner</div>

<div id="question"></div>
<div id="options"></div>
<div id="result"></div>

</div>

<script>

let xp = 0;
let level = 1;

let index = 0;
let bossMode = false;

/* LEVEL QUESTIONS */
const levels = {
1:[
{q:"What is Hello?",o:["안녕하세요","사랑","학교","물"],a:"안녕하세요"},
{q:"What is Thank You?",o:["감사합니다","책","의자","달"],a:"감사합니다"}
],
2:[
{q:"What is School?",o:["학교","차","강","불"],a:"학교"},
{q:"What is Friend?",o:["친구","바다","눈","산"],a:"친구"}
],
3:[
{q:"What is Water?",o:["물","사과","기차","버스"],a:"물"},
{q:"What is Love?",o:["사랑","고양이","커피","의자"],a:"사랑"}
]
};

/* BOSS QUESTIONS */
const bossQuestions = [
{
q:"🔥 BOSS: I want to go to Seoul",
o:["서울 가고 싶어요","학교 갑니다","물 주세요","친구 없어요"],
a:"서울 가고 싶어요"
},
{
q:"🔥 BOSS: Korean is fun",
o:["한국어 재미있어요","사랑합니다","학교입니다","물입니다"],
a:"한국어 재미있어요"
}
];

let currentLevel = 1;

/* LOAD */
function load(){

let q;

if(bossMode){
q = bossQuestions[Math.floor(Math.random()*bossQuestions.length)];
document.getElementById("question").classList.add("boss");
}else{
q = levels[currentLevel][index];
document.getElementById("question").classList.remove("boss");
}

document.getElementById("question").innerText = q.q;

let html = "";

q.o.forEach(op=>{
html += `<button class="option" onclick="check('${op}')">${op}</button>`;
});

document.getElementById("options").innerHTML = html;

}

/* CHECK */
function check(ans){

let q;

if(bossMode){
q = bossQuestions[0];
}else{
q = levels[currentLevel][index];
}

if(ans === q.a){

if(bossMode){
xp += 30;
bossMode = false;
document.getElementById("result").innerText =
"🔥 BOSS DEFEATED +30 XP";
}else{
xp += 10;
document.getElementById("result").innerText =
"✅ Correct +10 XP";
}

/* LEVEL TRIGGER BOSS */
if(index === 1){
bossMode = true;
}

}else{
document.getElementById("result").innerText =
"❌ Wrong";
}

/* LEVEL UP */
index++;

if(index >= levels[currentLevel].length){
index = 0;
currentLevel++;
level++;
}

update();
load();

}

/* UI */
function update(){

document.getElementById("xp").innerText = "XP: " + xp;
document.getElementById("level").innerText = "Level: " + level;

let badge = "🏅 Beginner";
if(level >= 3) badge = "🥈 Explorer";
if(level >= 5) badge = "🥇 Master";

document.getElementById("badge").innerText = badge;

/* MAP */
let maps = [
"📍 Seoul Station",
"🌆 Gangnam",
"🎓 University Zone",
"🛍️ Myeongdong",
"🌃 Han River"
];

document.getElementById("map").innerText =
maps[(level-1)%maps.length];

}

update();
load();

</script>

</body>
</html>
