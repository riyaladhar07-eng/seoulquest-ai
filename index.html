<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeoulQuest AI</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(to bottom,#020617,#0f172a,#000);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.game{
width:92%;
max-width:800px;
background:rgba(15,23,42,0.95);
padding:20px;
border-radius:20px;
text-align:center;
border:1px solid #334155;
}

h1{color:#38bdf8;}

#avatar{
background:#111827;
padding:10px;
border-radius:10px;
margin-bottom:10px;
}

.top{
display:flex;
justify-content:space-between;
font-size:14px;
}

.bar{
width:100%;
height:10px;
background:#1e293b;
border-radius:10px;
overflow:hidden;
margin:10px 0;
}

.fill{
height:100%;
width:0%;
background:#38bdf8;
}

.q{
font-size:20px;
margin:15px 0;
}

.btn{
display:block;
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
cursor:pointer;
}

.btn:hover{
background:#2563eb;
}

#result{
margin-top:10px;
min-height:20px;
}
</style>
</head>

<body>

<div class="game">

<h1>🎮 SeoulQuest AI</h1>

<div id="avatar">🤖 Riya Guide</div>

<div class="top">
<div>XP: <span id="xp">0</span></div>
<div>Level: <span id="level">1</span></div>
<div>Energy: <span id="energy">100</span></div>
</div>

<div class="bar"><div class="fill" id="bar"></div></div>

<div id="question" class="q"></div>
<div id="options"></div>
<div id="result"></div>

</div>

<script>

let xp=0;
let energy=100;
let currentAnswer="";
let chapter=1;
let qIndex=0;

/* ---------------- STORY CHAPTERS ---------------- */

const story=[
[
{q:"Chapter 1: How do you say Hello in Korean?",a:"안녕하세요",
o:["안녕하세요","감사합니다","학교","사랑"]},
{q:"How do you say Thank you?",a:"감사합니다",
o:["감사합니다","안녕","사랑","학교"]}
],

[
{q:"Chapter 2: What is School?",a:"학교",
o:["학교","집","물","차"]},
{q:"What is Book?",a:"책",
o:["책","문","길","사람"]}
],

[
{q:"Chapter 3: What is Friend?",a:"친구",
o:["친구","학교","집","차"]},
{q:"What is Love?",a:"사랑",
o:["사랑","물","길","문"]}
],

[
{q:"Chapter 4: What is Food?",a:"음식",
o:["음식","학교","차","길"]},
{q:"What is Water?",a:"물",
o:["물","사랑","친구","집"]}
],

[
{q:"FINAL CHAPTER: What is Seoul?",a:"서울",
o:["서울","도쿄","베이징","뉴욕"]}
]

];

/* ---------------- LOAD QUESTION ---------------- */

function load(){

if(chapter>story.length){
document.getElementById("question").innerHTML="🎉 STORY COMPLETE!";
document.getElementById("options").innerHTML="";
document.getElementById("result").innerHTML="🏆 You finished SeoulQuest AI!";
return;
}

let data=story[chapter-1][qIndex];

document.getElementById("question").innerText=data.q;
currentAnswer=data.a;

let html="";
data.o.forEach(op=>{
html+=`<button class="btn" onclick="check('${op}')">${op}</button>`;
});

document.getElementById("options").innerHTML=html;

}

/* ---------------- CHECK ---------------- */

function check(ans){

if(ans===currentAnswer){

xp+=10;
document.getElementById("result").innerText="✅ Correct +10 XP";

}else{

energy-=15;
document.getElementById("result").innerText="❌ Wrong";

}

qIndex++;

/* chapter complete */
if(qIndex>=story[chapter-1].length){
chapter++;
qIndex=0;
}

update();
load();
}

/* ---------------- UI ---------------- */

function update(){

document.getElementById("xp").innerText=xp;
document.getElementById("level").innerText=Math.floor(xp/50)+1;
document.getElementById("energy").innerText=energy;

document.getElementById("bar").style.width=(xp%50)*2+"%";

}

/* start */
load();
update();

</script>

</body>
</html>
