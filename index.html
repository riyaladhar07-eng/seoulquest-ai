<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeoulQuest AI Ultimate</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(to bottom,#020617,#0f172a,#000);
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.game{
width:92%;
max-width:900px;
background:rgba(15,23,42,0.95);
padding:20px;
border-radius:20px;
text-align:center;
border:1px solid #334155;
}

h1{color:#38bdf8;}

.btn{
display:block;
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
cursor:pointer;
}

.btn:hover{background:#2563eb;}

#box,#chat{
margin-top:10px;
}

input{
width:100%;
padding:10px;
border-radius:10px;
border:none;
margin-top:10px;
}

.panel{
margin-top:15px;
font-size:13px;
color:#93c5fd;
border-top:1px solid #334155;
padding-top:10px;
}

.badge{
display:inline-block;
padding:5px 10px;
margin:3px;
border-radius:20px;
background:#1e40af;
font-size:12px;
}
</style>
</head>

<body>

<div class="game">

<h1>🎮 SeoulQuest AI Ultimate</h1>

<div class="panel">
XP: <span id="xp">0</span> |
Level: <span id="level">1</span> |
Energy: <span id="energy">100</span>
</div>

<h3>Choose Mode</h3>

<div id="box"></div>

<div id="chat"></div>

<input id="input" placeholder="Ask Riya or type..." />

<button class="btn" onclick="askRiya()">🤖 Ask Riya</button>

<div id="result"></div>

<div class="panel">
<h4>🏆 Achievements</h4>
<div id="badges"></div>

<p>Correct: <span id="correct">0</span> |
Wrong: <span id="wrong">0</span> |
Accuracy: <span id="acc">0</span>%</p>
</div>

</div>

<script>

/* CORE */
let xp=0,energy=100,correct=0,wrong=0;
let badges=[];

/* SCENARIOS */
const roles={
airport:[
{q:"✈️ Name?",o:["저는 리야입니다","안녕하세요","물","학교"],a:"저는 리야입니다"},
{q:"✈️ Where?",o:["한국에 갑니다","책","커피","친구"],a:"한국에 갑니다"}
],
restaurant:[
{q:"🍜 Order?",o:["비빔밥 주세요","학교","물","게임"],a:"비빔밥 주세요"},
{q:"🍜 Drink?",o:["물 주세요","책","서울","친구"],a:"물 주세요"}
],
friend:[
{q:"👋 Name?",o:["저는 리야입니다","물","학교","서울"],a:"저는 리야입니다"},
{q:"👋 Meet?",o:["만나서 반갑습니다","게임","물","책"],a:"만나서 반갑습니다"}
],
shopping:[
{q:"🛍️ Price?",o:["이거 얼마예요?","학교","물","친구"],a:"이거 얼마예요?"}
]
};

let mode="";
let i=0;

/* BADGES */
function addBadge(b){
if(!badges.includes(b)) badges.push(b);
document.getElementById("badges").innerHTML =
badges.map(x=>`<span class="badge">${x}</span>`).join("");
}

/* MENU */
function menu(){
document.getElementById("box").innerHTML=`
<button class="btn" onclick="start('airport')">✈️ Airport</button>
<button class="btn" onclick="start('restaurant')">🍜 Restaurant</button>
<button class="btn" onclick="start('friend')">👋 Friend</button>
<button class="btn" onclick="start('shopping')">🛍️ Shopping</button>
<button class="btn" onclick="story()">📖 Story Mode</button>
`;
document.getElementById("chat").innerHTML="";
}

/* START ROLE */
function start(m){
mode=m;
i=0;
load();
}

/* LOAD */
function load(){
let s=roles[mode][i];
let html=`<h3>${s.q}</h3>`;
s.o.forEach(op=>{
html+=`<button class="btn" onclick="check('${op}')">${op}</button>`;
});
document.getElementById("box").innerHTML=html;
}

/* CHECK */
function check(ans){
let s=roles[mode][i];

if(ans===s.a){
xp+=10;
correct++;
if(correct===1) addBadge("🥇 First Win");
if(correct===5) addBadge("⚡ Fast Learner");
}else{
energy-=10;
wrong++;
}

i++;
update();

if(i>=roles[mode].length){
menu();
}else load();
}

/* STORY MODE */
function story(){
document.getElementById("box").innerHTML=`
<h3>📖 Chapter 1: Arrive in Seoul</h3>
<button class="btn" onclick="nextStory()">Next</button>
`;
}

let chapter=1;

function nextStory(){
chapter++;

if(chapter===2){
document.getElementById("box").innerHTML=
"<h3>👋 Meet a Friend</h3><p>안녕하세요 = Hello</p>";
}
else if(chapter===3){
document.getElementById("box").innerHTML=
"<h3>🍜 Restaurant</h3><p>비빔밥 주세요 = Bibimbap please</p>";
}
else{
document.getElementById("box").innerHTML=
"<h3>🎉 Story Completed!</h3>";
}
}

/* RIYA CHAT */
function askRiya(){
let text=document.getElementById("input").value.toLowerCase();
let chat=document.getElementById("chat");

chat.innerHTML+=`<div>👤 You: ${text}</div>`;

let res="";

if(text.includes("hello")){
res="안녕하세요 = Hello 👋";
}
else if(text.includes("hungry")){
res="배고파요 = I am hungry 🍜";
}
else if(text.includes("name")){
res="저는 리야입니다 = I am Riya 🤖";
}
else{
res="Try: hello, name, hungry 😊";
}

chat.innerHTML+=`<div>🤖 Riya: ${res}</div>`;
document.getElementById("input").value="";
}

/* UPDATE */
function update(){
document.getElementById("xp").innerText=xp;
document.getElementById("level").innerText=Math.floor(xp/50)+1;
document.getElementById("energy").innerText=energy;

document.getElementById("correct").innerText=correct;
document.getElementById("wrong").innerText=wrong;

let total=correct+wrong;
let acc=total?Math.round((correct/total)*100):0;
document.getElementById("acc").innerText=acc;
}

/* START */
menu();
update();

</script>

</body>
</html>
