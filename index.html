<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeoulQuest AI - Next Level</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(to bottom,#020617,#0f172a,#000);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.game{
width:92%;
max-width:850px;
background:rgba(15,23,42,0.95);
padding:20px;
border-radius:20px;
text-align:center;
border:1px solid #334155;
}

h1{color:#38bdf8;}

.top{
display:flex;
justify-content:space-between;
font-size:14px;
margin-bottom:10px;
}

.bar{
width:100%;
height:10px;
background:#1e293b;
border-radius:10px;
overflow:hidden;
margin-bottom:10px;
}

.fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#38bdf8,#0ea5e9);
}

.btn{
display:block;
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
cursor:pointer;
}

.btn:hover{background:#2563eb;}

.mode{
display:flex;
gap:6px;
flex-wrap:wrap;
justify-content:center;
margin-bottom:10px;
}

.mode button{
padding:8px;
border-radius:8px;
border:none;
background:#334155;
color:white;
cursor:pointer;
font-size:12px;
}

.mode button:hover{
background:#2563eb;
}
</style>
</head>

<body>

<div class="game">

<h1>🎮 SeoulQuest AI 2.0</h1>

<div class="top">
<div>XP: <span id="xp">0</span></div>
<div>Level: <span id="level">1</span></div>
<div>Energy: <span id="energy">100</span></div>
</div>

<div class="bar"><div class="fill" id="bar"></div></div>

<div class="mode">
<button onclick="setMode('vocab')">📘 Vocabulary</button>
<button onclick="setMode('restaurant')">🍜 Restaurant</button>
<button onclick="setMode('airport')">✈️ Airport</button>
<button onclick="setMode('shopping')">🛍️ Shopping</button>
<button onclick="setMode('story')">📖 Story Mode</button>
</div>

<div id="question"></div>
<div id="options"></div>
<div id="result"></div>

</div>

<script>

let xp=0;
let energy=100;
let currentAnswer="";
let mode="vocab";

/* ================= BIGGER WORD BANK ================= */

const vocab=[
["Hello","안녕하세요"],
["Good morning","좋은 아침"],
["Good night","안녕히 주무세요"],
["Thank you","감사합니다"],
["Sorry","죄송합니다"],
["Friend","친구"],
["Love","사랑"],
["School","학교"],
["Food","음식"],
["Water","물"],
["Bus","버스"],
["Train","기차"],
["Airport","공항"],
["Restaurant","식당"],
["Order","주문"],
["Price","가격"],
["Ticket","표"],
["Where","어디"],
["When","언제"],
["Why","왜"]
];

const restaurant=[
["I want to order","주문하고 싶어요"],
["Menu please","메뉴 주세요"],
["Delicious","맛있어요"],
["Water please","물 주세요"],
["Bill please","계산서 주세요"]
];

const airport=[
["Where is airport?","공항 어디예요?"],
["Check-in","체크인"],
["Passport","여권"],
["Boarding","탑승"],
["Flight","비행기"]
];

const shopping=[
["How much?","얼마예요?"],
["Too expensive","너무 비싸요"],
["Discount","할인"],
["Buy this","이거 사요"],
["Cash","현금"]
];

/* ================= STORY ================= */

const story=[
"Chapter 1: You arrive in Seoul. Say Hello",
"Chapter 2: You meet a Korean friend",
"Chapter 3: You order food at a restaurant",
"Chapter 4: You go shopping in Myeongdong"
];

let storyIndex=0;

/* ================= MODE SWITCH ================= */

function setMode(m){
mode=m;
load();
}

/* ================= GENERATE ================= */

function getBank(){
if(mode==="restaurant") return restaurant;
if(mode==="airport") return airport;
if(mode==="shopping") return shopping;
return vocab;
}

/* ================= LOAD ================= */

function load(){

let bank=getBank();

let item=bank[Math.floor(Math.random()*bank.length)];

let wrong=bank.filter(x=>x[1]!=item[1])
.sort(()=>Math.random()-0.5)
.slice(0,3)
.map(x=>x[1]);

let options=[...wrong,item[1]].sort(()=>Math.random()-0.5);

if(mode==="story"){
document.getElementById("question").innerText=story[storyIndex];
currentAnswer="안녕하세요";
options=["안녕하세요","감사합니다","사랑","학교"];
}
else{
document.getElementById("question").innerText=
`What is "${item[0]}" in Korean?`;
currentAnswer=item[1];
}

let html="";
options.forEach(op=>{
html+=`<button class="btn" onclick="check('${op}')">${op}</button>`;
});

document.getElementById("options").innerHTML=html;
}

/* ================= CHECK ================= */

function check(ans){

if(ans===currentAnswer){
xp+=10;
document.getElementById("result").innerText="✅ Correct +10 XP";
}else{
energy-=10;
document.getElementById("result").innerText="❌ Wrong";
}

/* STORY PROGRESS */
if(mode==="story" && ans===currentAnswer){
storyIndex++;
if(storyIndex>=story.length) storyIndex=0;
}

if(energy<=0){
alert("Game Over");
xp=0;
energy=100;
}

update();
load();
}

/* ================= UPDATE ================= */

function update(){
document.getElementById("xp").innerText=xp;
document.getElementById("level").innerText=Math.floor(xp/50)+1;
document.getElementById("energy").innerText=energy;

let bar=(xp%50)*2;
document.getElementById("bar").style.width=bar+"%";
}

load();
update();

</script>

</body>
</html>
