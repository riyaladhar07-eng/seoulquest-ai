<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeoulQuest AI v3</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(to bottom,#020617,#0f172a,#000);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.game{
width:92%;
max-width:850px;
background:rgba(15,23,42,0.95);
padding:20px;
border-radius:20px;
text-align:center;
border:1px solid #334155;
}

h1{color:#38bdf8;}

.top{
display:flex;
justify-content:space-between;
font-size:14px;
margin-bottom:10px;
}

.bar{
width:100%;
height:10px;
background:#1e293b;
border-radius:10px;
overflow:hidden;
margin-bottom:10px;
}

.fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#38bdf8,#0ea5e9);
}

.btn{
display:block;
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
cursor:pointer;
}

.btn:hover{background:#2563eb;}

.mode button{
margin:4px;
padding:8px;
border-radius:8px;
border:none;
background:#334155;
color:white;
cursor:pointer;
}
</style>
</head>

<body>

<div class="game">

<h1>🎮 SeoulQuest AI v3</h1>

<div class="top">
<div>XP: <span id="xp">0</span></div>
<div>Level: <span id="level">1</span></div>
<div>Energy: <span id="energy">100</span></div>
</div>

<div class="bar"><div class="fill" id="bar"></div></div>

<div>
<button onclick="setMode('vocab')">📘 Vocab</button>
<button onclick="setMode('restaurant')">🍜 Food</button>
<button onclick="setMode('airport')">✈️ Travel</button>
<button onclick="setMode('shopping')">🛍️ Shop</button>
</div>

<div id="question"></div>
<div id="options"></div>
<div id="result"></div>

</div>

<script>

let xp=0;
let energy=100;
let mode="vocab";
let currentAnswer="";

/* ================= FULL 10 WORD BANKS ================= */

const vocab=[
["Hello","안녕하세요"],["Thank you","감사합니다"],
["Sorry","죄송합니다"],["Friend","친구"],
["Love","사랑"],["School","학교"],
["Book","책"],["Water","물"],
["Food","음식"],["Study","공부"]
];

const restaurant=[
["Menu","메뉴"],["Order","주문"],["Delicious","맛있다"],
["Water","물"],["Bill","계산서"],
["Eat","먹다"],["Drink","마시다"],
["Hungry","배고프다"],["Spicy","매워요"],["Chef","요리사"]
];

const airport=[
["Airport","공항"],["Passport","여권"],["Flight","비행기"],
["Ticket","표"],["Gate","탑승구"],
["Boarding","탑승"],["Luggage","짐"],
["Check-in","체크인"],["Arrival","도착"],["Departure","출발"]
];

const shopping=[
["Price","가격"],["Cheap","싸다"],["Expensive","비싸다"],
["Discount","할인"],["Buy","구매"],
["Sell","팔다"],["Cash","현금"],
["Card","카드"],["Store","가게"],["Size","사이즈"]
];

/* ================= MODE ================= */

function setMode(m){
mode=m;
load();
}

/* ================= GENERATOR ================= */

function bank(){
if(mode==="restaurant") return restaurant;
if(mode==="airport") return airport;
if(mode==="shopping") return shopping;
return vocab;
}

/* ================= LOAD ================= */

function load(){

let data=bank();

let item=data[Math.floor(Math.random()*data.length)];

let wrong=data.filter(x=>x[1]!=item[1])
.sort(()=>Math.random()-0.5)
.slice(0,3)
.map(x=>x[1]);

let options=[...wrong,item[1]].sort(()=>Math.random()-0.5);

document.getElementById("question").innerText=
`What is "${item[0]}" in Korean?`;

currentAnswer=item[1];

let html="";
options.forEach(op=>{
html+=`<button class="btn" onclick="check('${op}')">${op}</button>`;
});

document.getElementById("options").innerHTML=html;
}

/* ================= CHECK ================= */

function check(ans){

if(ans===currentAnswer){
xp+=10;
document.getElementById("result").innerText="✅ Correct +10 XP";
}else{
energy-=10;
document.getElementById("result").innerText="❌ Wrong";
}

if(energy<=0){
alert("Game Over");
xp=0;
energy=100;
}

update();
load();
}

/* ================= UPDATE ================= */

function update(){
document.getElementById("xp").innerText=xp;
document.getElementById("level").innerText=Math.floor(xp/50)+1;
document.getElementById("energy").innerText=energy;

document.getElementById("bar").style.width=(xp%50)*2+"%";
}

load();
update();

</script>

</body>
</html>
