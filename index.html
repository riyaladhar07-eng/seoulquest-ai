<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeoulQuest AI</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(to bottom,#020617,#0f172a,#000);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.game{
width:92%;
max-width:800px;
background:rgba(15,23,42,0.95);
padding:20px;
border-radius:20px;
text-align:center;
border:1px solid #334155;
}

h1{color:#38bdf8;}

#avatar{
background:#111827;
padding:12px;
border-radius:15px;
margin-bottom:15px;
border:1px solid #334155;
}

.top{
display:flex;
justify-content:space-between;
font-size:14px;
margin-bottom:10px;
}

.bar{
width:100%;
height:10px;
background:#1e293b;
border-radius:10px;
overflow:hidden;
margin-bottom:10px;
}

.fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#38bdf8,#0ea5e9);
}

.q{
font-size:20px;
margin:15px 0;
}

.btn{
display:block;
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
cursor:pointer;
}

.btn:hover{
background:#2563eb;
}

#badges{
margin-top:10px;
font-size:14px;
color:#fbbf24;
}
</style>
</head>

<body>

<div class="game">

<h1>🎮 SeoulQuest AI</h1>

<div id="avatar">🤖 Riya Guide: Learn Korean 🇰🇷</div>

<div class="top">
<div>XP: <span id="xp">0</span></div>
<div>Level: <span id="level">1</span></div>
<div>Energy: <span id="energy">100</span></div>
</div>

<div class="bar">
<div class="fill" id="bar"></div>
</div>

<div id="badges">🏆 Badges: None</div>

<div class="q" id="question"></div>
<div id="options"></div>
<div id="result"></div>

<button class="btn" onclick="startStory()">📖 Start Story Mode</button>

</div>

<script>

/* ================= DATA ================= */
let xp = parseInt(localStorage.getItem("xp")) || 0;
let energy = parseInt(localStorage.getItem("energy")) || 100;
let streak = 0;
let combo = 0;
let currentAnswer = "";

/* ================= BADGES ================= */
let badges = JSON.parse(localStorage.getItem("badges")) || [];

function unlockBadge(name){
if(!badges.includes(name)){
badges.push(name);
localStorage.setItem("badges", JSON.stringify(badges));
}
}

/* ================= WORD BANK ================= */
function words(){
return [
["Hello","안녕하세요"],
["Thank you","감사합니다"],
["Sorry","죄송합니다"],
["Friend","친구"],
["Love","사랑"],
["School","학교"],
["Book","책"],
["Water","물"],
["Food","음식"],
["Bus","버스"],
["Train","기차"],
["City","도시"],
["Korea","한국"],
["Seoul","서울"],
["Game","게임"],
["Study","공부"]
];
}

/* ================= GENERATE ================= */
function gen(){
let w = words();
let item = w[Math.floor(Math.random()*w.length)];

let wrong = w.filter(x=>x[1]!=item[1])
.sort(()=>Math.random()-0.5)
.slice(0,3)
.map(x=>x[1]);

let options = [...wrong,item[1]].sort(()=>Math.random()-0.5);

return {
q:`What is "${item[0]}" in Korean?`,
o:options,
a:item[1]
};
}

/* ================= LOAD ================= */
function load(){
let q = gen();
currentAnswer = q.a;

document.getElementById("question").innerText = q.q;

document.getElementById("options").innerHTML =
q.o.map(op=>`<button class="btn" onclick="check('${op}')">${op}</button>`).join("");
}

/* ================= CHECK ================= */
function check(ans){

if(ans === currentAnswer){

xp += 10;
streak++;
combo++;

document.getElementById("result").innerText = "✅ Correct +10 XP";

/* BADGES SYSTEM */
if(xp >= 50) unlockBadge("🌱 Beginner");
if(xp >= 150) unlockBadge("⚡ Learner");
if(streak >= 3) unlockBadge("🔥 Streak Master");
if(combo >= 5) unlockBadge("💥 Combo King");

}else{

streak = 0;
combo = 0;
energy -= 15;

document.getElementById("result").innerText = "❌ Wrong!";
}

/* LEVEL SYSTEM */
let level = Math.floor(xp / 50) + 1;

/* SAVE */
localStorage.setItem("xp", xp);
localStorage.setItem("energy", energy);

/* GAME OVER */
if(energy <= 0){
alert("Game Over! Restarting...");
xp = 0;
energy = 100;
}

/* UPDATE */
update();
updateBadges();
load();
}

/* ================= UI UPDATE ================= */
function update(){
document.getElementById("xp").innerText = xp;
document.getElementById("level").innerText = Math.floor(xp/50)+1;
document.getElementById("energy").innerText = energy;

document.getElementById("bar").style.width = (xp % 50) * 2 + "%";
}

/* ================= BADGE UI ================= */
function updateBadges(){
document.getElementById("badges").innerText =
badges.length ? "🏆 Badges: " + badges.join(" | ") : "🏆 Badges: None";
}

/* ================= STORY MODE ================= */
function startStory(){

document.getElementById("question").innerText =
"🇰🇷 Chapter 1: You arrive in Seoul Airport. Say Hello in Korean.";

currentAnswer = "안녕하세요";

document.getElementById("options").innerHTML = `
<button class="btn" onclick="check('안녕하세요')">안녕하세요</button>
<button class="btn" onclick="check('감사합니다')">감사합니다</button>
<button class="btn" onclick="check('사랑')">사랑</button>
<button class="btn" onclick="check('학교')">학교</button>
`;

document.getElementById("result").innerText = "📖 Story Mode Started!";
}

/* ================= INIT ================= */
update();
updateBadges();
load();

</script>

</body>
</html>
