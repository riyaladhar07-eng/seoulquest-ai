<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeoulQuest AI</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(to bottom,#020617,#0f172a,#000);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.game{
width:92%;
max-width:850px;
background:rgba(15,23,42,0.95);
padding:20px;
border-radius:20px;
text-align:center;
border:1px solid #334155;
}

h1{color:#38bdf8;}

.top{
display:flex;
justify-content:space-between;
font-size:14px;
margin:10px 0;
}

.btn{
display:block;
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
cursor:pointer;
transition:0.2s;
}

.btn:hover{
background:#2563eb;
}

#box{margin-top:10px;}
#result{margin-top:10px;min-height:20px;color:#67e8f9;}

.panel{
margin-top:10px;
font-size:13px;
color:#a5b4fc;
border-top:1px solid #334155;
padding-top:10px;
}
.badge{
display:inline-block;
padding:5px 10px;
margin:3px;
border-radius:20px;
background:#1e40af;
font-size:12px;
}
</style>
</head>

<body>

<div class="game">

<h1>🎮 SeoulQuest AI Pro</h1>

<div class="top">
<div>XP: <span id="xp">0</span></div>
<div>Level: <span id="level">1</span></div>
<div>Energy: <span id="energy">100</span></div>
</div>

<h3>🎭 Role Play Mode</h3>

<div id="box"></div>
<div id="result"></div>

<div class="panel">
<h4>🏆 Achievements</h4>
<div id="badges"></div>

<p>✔ Correct: <span id="correct">0</span> | ❌ Wrong: <span id="wrong">0</span></p>
<p>🎯 Accuracy: <span id="accuracy">0</span>%</p>
</div>

</div>

<script>

/* CORE */
let xp=0;
let energy=100;
let currentScenario="";
let currentIndex=0;

let correct=0;
let wrong=0;
let badges=[];

/* BADGE SYSTEM */
function addBadge(name){
if(!badges.includes(name)){
badges.push(name);
}
renderBadges();
}

function renderBadges(){
document.getElementById("badges").innerHTML =
badges.map(b=>`<span class="badge">${b}</span>`).join("");
}

/* SCENARIOS */
const scenarios={
airport:[
{q:"✈️ Officer: Name?",options:["저는 리야입니다","감사합니다","안녕하세요","물"],answer:"저는 리야입니다"},
{q:"✈️ Where going?",options:["한국에 갑니다","학교","사랑","책"],answer:"한국에 갑니다"},
{q:"✈️ Passport?",options:["여기 있습니다","친구","커피","집"],answer:"여기 있습니다"}
],
restaurant:[
{q:"🍜 Order food",options:["비빔밥 주세요","안녕하세요","학교","물"],answer:"비빔밥 주세요"},
{q:"🍜 Drink?",options:["물 주세요","책","서울","게임"],answer:"물 주세요"},
{q:"🍜 Taste?",options:["맛있었습니다","친구","학교","안녕"],answer:"맛있었습니다"}
],
friend:[
{q:"👋 Name?",options:["저는 리야입니다","물","학교","서울"],answer:"저는 리야입니다"},
{q:"👋 From?",options:["인도에서 왔어요","비빔밥","책","커피"],answer:"인도에서 왔어요"},
{q:"👋 Nice meet?",options:["만나서 반갑습니다","학교","물","게임"],answer:"만나서 반갑습니다"}
],
shopping:[
{q:"🛍️ Price?",options:["이거 얼마예요?","안녕하세요","학교","물"],answer:"이거 얼마예요?"},
{q:"🛍️ Pay",options:["여기요","책","서울","친구"],answer:"여기요"},
{q:"🛍️ Thanks",options:["감사합니다","학교","물","게임"],answer:"감사합니다"}
]
};

/* MENU */
function menu(){
currentIndex=0;
document.getElementById("box").innerHTML=`
<button class="btn" onclick="start('airport')">✈️ Airport</button>
<button class="btn" onclick="start('restaurant')">🍜 Restaurant</button>
<button class="btn" onclick="start('friend')">👋 Friend</button>
<button class="btn" onclick="start('shopping')">🛍️ Shopping</button>
`;
}

/* START */
function start(type){
currentScenario=type;
currentIndex=0;
load();
}

/* LOAD */
function load(){
let s=scenarios[currentScenario][currentIndex];
let html=`<h3>${s.q}</h3>`;
s.options.forEach(op=>{
html+=`<button class="btn" onclick="check('${op}')">${op}</button>`;
});
document.getElementById("box").innerHTML=html;
}

/* CHECK */
function check(ans){
let s=scenarios[currentScenario][currentIndex];

if(ans===s.answer){
xp+=10;
correct++;

if(correct===1) addBadge("🥇 First Win");
if(correct===5) addBadge("⚡ Fast Learner");
if(correct===10) addBadge("🎭 Role Master");

document.getElementById("result").innerText="✅ Correct +10 XP";
}else{
energy-=10;
wrong++;
document.getElementById("result").innerText="❌ Wrong";
}

currentIndex++;
update();

setTimeout(()=>{
if(currentIndex>=scenarios[currentScenario].length){
menu();
}else load();
},900);
}

/* UPDATE */
function update(){
document.getElementById("xp").innerText=xp;
document.getElementById("level").innerText=Math.floor(xp/50)+1;
document.getElementById("energy").innerText=energy;

let acc = correct+wrong===0?0:Math.round((correct/(correct+wrong))*100);

document.getElementById("correct").innerText=correct;
document.getElementById("wrong").innerText=wrong;
document.getElementById("accuracy").innerText=acc;

renderBadges();
}

/* START */
menu();
update();

</script>

</body>
</html>
