<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeoulQuest AI FINAL</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(to bottom,#020617,#0f172a,#000);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.app{
width:92%;
max-width:900px;
background:rgba(15,23,42,0.95);
padding:20px;
border-radius:20px;
border:1px solid #334155;
text-align:center;
}

h1{color:#38bdf8;}

.top{
display:flex;
justify-content:space-between;
font-size:13px;
margin-bottom:10px;
}

.bar{
width:100%;
height:10px;
background:#1e293b;
border-radius:10px;
overflow:hidden;
margin-bottom:10px;
}

.fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#38bdf8,#0ea5e9);
transition:0.3s;
}

button{
padding:10px;
margin:5px;
border:none;
border-radius:8px;
background:#334155;
color:white;
cursor:pointer;
}

button:hover{background:#2563eb;}

.question{
font-size:20px;
margin:15px 0;
}

.badges{
margin-top:10px;
font-size:13px;
color:#fbbf24;
}
</style>
</head>

<body>

<div class="app">

<h1>🎮 SeoulQuest AI FINAL</h1>

<div class="top">
<div>XP: <span id="xp">0</span></div>
<div>Level: <span id="level">1</span></div>
<div>Energy: <span id="energy">100</span></div>
<div>✔ Correct: <span id="correct">0</span></div>
</div>

<div class="bar"><div class="fill" id="bar"></div></div>

<div>
<button onclick="setMode('story')">📖 Story</button>
<button onclick="setMode('vocab')">📘 Vocab</button>
<button onclick="setMode('role')">🎭 Roleplay</button>
</div>

<div class="question" id="question"></div>
<div id="options"></div>
<div id="result"></div>

<div class="badges" id="badges">🏅 Badges: None</div>

</div>

<script>

/* ================= STATE ================= */

let xp=0;
let energy=100;
let correct=0;
let mode="story";
let step=0;
let currentAnswer="";

/* load saved */
if(localStorage.getItem("sqxp")){
xp=parseInt(localStorage.getItem("sqxp"));
correct=parseInt(localStorage.getItem("sqcorrect"));
}

/* ================= BADGES ================= */

let badges=[];

function checkBadges(){

if(correct>=1 && !badges.includes("First Win")) badges.push("First Win 🥇");
if(xp>=100 && !badges.includes("XP Rookie")) badges.push("XP Rookie ⚡");
if(step>=2 && mode==="story") badges.push("Story Learner 📖");
if(correct>=10) badges.push("Korean Starter 🇰🇷");

document.getElementById("badges").innerText =
"🏅 Badges: " + (badges.join(", ") || "None");
}

/* ================= DATA ================= */

const vocab=[
["Hello","안녕하세요"],["Thank you","감사합니다"],
["School","학교"],["Book","책"],["Study","공부"],
["Friend","친구"],["Water","물"],["Food","음식"],
["Love","사랑"],["Teacher","선생님"]
];

const story=[
{q:"You arrive in Seoul. Say Hello",a:"안녕하세요",o:["안녕하세요","감사합니다","학교"]},
{q:"You meet a friend",a:"친구",o:["친구","물","책"]},
{q:"You are hungry",a:"배고파요",o:["배고파요","학교","사랑"]}
];

const role=[
{q:"Restaurant: Ask menu",a:"메뉴 주세요",o:["메뉴 주세요","학교","책"]},
{q:"Airport: Where is gate?",a:"탑승구 어디예요",o:["탑승구 어디예요","물","사랑"]},
{q:"Shop: price?",a:"얼마예요",o:["얼마예요","친구","학교"]}
];

/* ================= MODE ================= */

function setMode(m){
mode=m;
step=0;
load();
}

/* ================= LOAD ================= */

function load(){

let data;

if(mode==="vocab") data=vocab;
if(mode==="story") data=story;
if(mode==="role") data=role;

/* STORY / ROLE */
if(mode!=="vocab"){

let item=data[step % data.length];

document.getElementById("question").innerText=item.q;
currentAnswer=item.a;

renderOptions(item.o);
return;
}

/* VOCAB */
let item=data[Math.floor(Math.random()*data.length)];

currentAnswer=item[1];

let wrong=data.filter(x=>x[1]!==item[1])
.slice(0,3)
.map(x=>x[1]);

renderOptions([...wrong,item[1]]);

document.getElementById("question").innerText =
`What is "${item[0]}" in Korean?`;
}

/* ================= OPTIONS ================= */

function renderOptions(arr){

arr=arr.sort(()=>Math.random()-0.5);

let html="";
arr.forEach(op=>{
html+=`<button onclick="check('${op}')">${op}</button>`;
});

document.getElementById("options").innerHTML=html;
}

/* ================= CHECK ================= */

function check(ans){

if(ans===currentAnswer){

xp+=10;
correct++;
step++;

document.getElementById("result").innerText="✅ Correct +10 XP";

}else{
energy-=10;
document.getElementById("result").innerText="❌ Wrong -10 Energy";
}

if(energy<=0){
alert("Game Over");
xp=0;
energy=100;
correct=0;
step=0;
}

save();
update();
checkBadges();
load();
}

/* ================= SAVE ================= */

function save(){
localStorage.setItem("sqxp",xp);
localStorage.setItem("sqcorrect",correct);
}

/* ================= UPDATE ================= */

function update(){

document.getElementById("xp").innerText=xp;
document.getElementById("level").innerText=Math.floor(xp/50)+1;
document.getElementById("energy").innerText=energy;
document.getElementById("correct").innerText=correct;

document.getElementById("bar").style.width=(xp%50)*2+"%";
}

/* ================= INIT ================= */

load();
update();
checkBadges();

</script>

</body>
</html>
