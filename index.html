<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeoulQuest AI</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(to bottom,#020617,#0f172a,#000);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.game{
width:95%;
max-width:850px;
background:#0f172a;
padding:20px;
border-radius:20px;
border:1px solid #334155;
text-align:center;
}

h1{color:#38bdf8;}

.top{
display:flex;
justify-content:space-between;
margin-bottom:10px;
font-size:14px;
}

.bar{
width:100%;
height:10px;
background:#1e293b;
border-radius:10px;
overflow:hidden;
margin:10px 0;
}

.fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#38bdf8,#0ea5e9);
transition:0.3s;
}

.q{
font-size:18px;
margin:15px 0;
}

.btn{
display:block;
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
cursor:pointer;
}

.btn:hover{
background:#2563eb;
}
.mode{
display:flex;
gap:10px;
flex-wrap:wrap;
justify-content:center;
margin-bottom:10px;
}

.smallBtn{
padding:8px 12px;
background:#111827;
border:1px solid #334155;
border-radius:10px;
cursor:pointer;
color:white;
}
</style>
</head>

<body>

<div class="game">

<h1>🎮 SeoulQuest AI</h1>

<div class="top">
<div>XP: <span id="xp">0</span></div>
<div>Level: <span id="level">1</span></div>
<div>Story: <span id="story">1</span></div>
</div>

<div class="bar">
<div class="fill" id="bar"></div>
</div>

<!-- MODE SELECT -->
<div class="mode">
<button class="smallBtn" onclick="setMode('restaurant')">🍜 Restaurant</button>
<button class="smallBtn" onclick="setMode('airport')">✈️ Airport</button>
<button class="smallBtn" onclick="setMode('cafe')">☕ Café</button>
<button class="smallBtn" onclick="setMode('school')">🎓 School</button>
<button class="smallBtn" onclick="storyMode()">📖 Story Mode</button>
</div>

<div class="q" id="question">Select a mode to start</div>
<div id="options"></div>
<div id="result"></div>

</div>

<script>

let xp=0;
let currentAnswer="";
let mode="restaurant";
let storyLevel=1;

/* ================= VOCAB BY CONTEXT ================= */
const data = {

restaurant:[
{q:"You enter a restaurant. How do you say Hello?",a:"안녕하세요",o:["안녕하세요","감사합니다","학교","사랑"]},
{q:"How do you say 'Water'?",a:"물",o:["물","버스","책","집"]},
{q:"How do you say 'Food'?",a:"음식",o:["음식","차","길","공항"]}
],

airport:[
{q:"At airport, how do you say Hello?",a:"안녕하세요",o:["안녕하세요","음식","책","학교"]},
{q:"How do you say 'Airplane'?",a:"비행기",o:["비행기","버스","시장","물"]},
{q:"How do you say 'Airport'?",a:"공항",o:["공항","집","커피","책"]}
],

cafe:[
{q:"At café, how do you greet staff?",a:"안녕하세요",o:["안녕하세요","비행기","학교","시장"]},
{q:"How do you say 'Coffee'?",a:"커피",o:["커피","물","집","책"]},
{q:"How do you say 'Tea'?",a:"차",o:["차","버스","학교","길"]}
],

school:[
{q:"At school, greet teacher?",a:"안녕하세요",o:["안녕하세요","물","시장","비행기"]},
{q:"How do you say 'Student'?",a:"학생",o:["학생","집","커피","길"]},
{q:"How do you say 'Book'?",a:"책",o:["책","차","버스","공항"]}
]
};

/* ================= MODE ================= */
function setMode(m){
mode=m;
load();
}

/* ================= STORY MODE ================= */
function storyMode(){

let stories=[
"Chapter 1: You arrive in Seoul 🇰🇷",
"Chapter 2: You meet a Korean friend 👋",
"Chapter 3: You enter a café ☕",
"Chapter 4: You travel by subway 🚇"
];

document.getElementById("question").innerText=stories[storyLevel-1];

document.getElementById("options").innerHTML=`
<button class="btn" onclick="nextStory()">Continue</button>
`;

}

/* ================= STORY NEXT ================= */
function nextStory(){

xp+=20;
storyLevel++;

if(storyLevel>4){
storyLevel=1;
}

update();
storyMode();
}

/* ================= LOAD QUESTION ================= */
function load(){

let list=data[mode];
let item=list[Math.floor(Math.random()*list.length)];

currentAnswer=item.a;

document.getElementById("question").innerText=item.q;

let html="";
item.o.forEach(op=>{
html+=`<button class="btn" onclick="check('${op}')">${op}</button>`;
});

document.getElementById("options").innerHTML=html;
}

/* ================= CHECK ================= */
function check(ans){

if(ans===currentAnswer){
xp+=10;
document.getElementById("result").innerText="✅ Correct +10 XP";
}else{
document.getElementById("result").innerText="❌ Wrong";
}

update();
load();
}

/* ================= UPDATE ================= */
function update(){

document.getElementById("xp").innerText=xp;
document.getElementById("level").innerText=Math.floor(xp/50)+1;
document.getElementById("story").innerText=storyLevel;

let bar=(xp%50)*2;
document.getElementById("bar").style.width=bar+"%";
}

</script>

</body>
</html>
