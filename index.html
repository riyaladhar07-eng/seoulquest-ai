<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SeoulQuest AI</title>

<style>

/* ===== BACKGROUND ===== */
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(to bottom,#020617,#0f172a,#000);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

/* ===== GAME BOX ===== */
.game{
width:92%;
max-width:800px;
background:rgba(15,23,42,0.95);
padding:20px;
border-radius:20px;
text-align:center;
border:1px solid #334155;
animation:fadeIn 1s ease;
}

@keyframes fadeIn{
from{opacity:0; transform:scale(0.9);}
to{opacity:1; transform:scale(1);}
}

/* ===== TITLE ===== */
h1{color:#38bdf8;}

/* ===== AVATAR ===== */
#avatar{
background:#111827;
padding:12px;
border-radius:15px;
margin-bottom:15px;
border:1px solid #334155;
transition:0.3s;
}

/* ===== TOP BAR ===== */
.top{
display:flex;
justify-content:space-between;
margin-bottom:10px;
font-size:14px;
}

/* ===== XP BAR ===== */
.bar{
width:100%;
height:10px;
background:#1e293b;
border-radius:10px;
overflow:hidden;
margin-bottom:10px;
}

.fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#38bdf8,#0ea5e9);
transition:0.3s;
}

/* ===== QUESTION ===== */
.q{
font-size:20px;
margin:15px 0;
transition:0.3s;
}

/* ===== BUTTONS ===== */
.btn{
display:block;
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
cursor:pointer;
transition:0.2s;
}

.btn:hover{
background:#2563eb;
transform:scale(1.03);
}

/* ===== RESULT ===== */
#result{
min-height:25px;
margin-top:10px;
}

</style>
</head>

<body>

<div class="game">

<h1>🎮 SeoulQuest AI</h1>

<div id="avatar">🤖 Riya Guide: Learn Korean 🇰🇷</div>

<div class="top">
<div>XP: <span id="xp">0</span></div>
<div>Level: <span id="level">1</span></div>
<div>Energy: <span id="energy">100</span></div>
</div>

<div class="bar">
<div class="fill" id="bar"></div>
</div>

<div class="q" id="question"></div>

<div id="options"></div>

<div id="result"></div>

</div>

<script>

/* ===== GAME DATA ===== */
let xp = 0;
let energy = 100;
let combo = 0;
let currentAnswer = "";

/* ===== RIYA AVATAR ===== */
function avatar(type){

let av = document.getElementById("avatar");

if(type==="correct"){
av.innerHTML="🤖 Riya: Excellent! ⭐";
}else if(type==="wrong"){
av.innerHTML="🤖 Riya: Try again 💡";
}else{
av.innerHTML="🤖 Riya Guide: Learn Korean 🇰🇷";
}

setTimeout(()=>{
av.innerHTML="🤖 Riya Guide: Learn Korean 🇰🇷";
},1200);

}

/* ===== 50+ WORDS ===== */
function words(){
return [
["Hello","안녕하세요"],
["Thank you","감사합니다"],
["Sorry","죄송합니다"],
["Friend","친구"],
["Love","사랑"],
["School","학교"],
["Book","책"],
["Water","물"],
["Food","음식"],
["Bus","버스"],
["Train","기차"],
["City","도시"],
["Korea","한국"],
["Seoul","서울"],
["Game","게임"],
["Study","공부"],
["Music","음악"],
["Movie","영화"],
["Night","밤"],
["Day","하루"],
["Time","시간"],
["Teacher","선생님"],
["Student","학생"],
["Coffee","커피"],
["Dog","개"],
["Cat","고양이"],
["Phone","전화"],
["Computer","컴퓨터"],
["Internet","인터넷"],
["Weather","날씨"],
["Hot","더워"],
["Cold","추워"],
["Happy","행복"],
["Sad","슬픈"],
["Fast","빠른"],
["Slow","느린"],
["Red","빨간색"],
["Blue","파란색"],
["Green","초록색"],
["White","흰색"],
["Black","검은색"],
["Car","자동차"],
["Airplane","비행기"],
["Airport","공항"],
["House","집"],
["Market","시장"],
["Street","거리"],
["Walk","걷다"],
["Run","달리다"]
];
}

/* ===== GENERATE QUESTION ===== */
function gen(){

let w = words();

let item = w[Math.floor(Math.random()*w.length)];

let wrong = w.filter(x=>x[1]!=item[1])
.sort(()=>Math.random()-0.5)
.slice(0,3)
.map(x=>x[1]);

let options = [...wrong,item[1]]
.sort(()=>Math.random()-0.5);

return {
q:`What is "${item[0]}" in Korean?`,
o:options,
a:item[1]
};

}

/* ===== LOAD ===== */
function load(){

let q = gen();
currentAnswer = q.a;

document.getElementById("question").innerText=q.q;

let html="";

q.o.forEach(op=>{
html+=`<button class="btn" onclick="check('${op}')">${op}</button>`;
});

document.getElementById("options").innerHTML=html;

}

/* ===== CHECK ===== */
function check(ans){

if(ans===currentAnswer){

xp+=10;
combo++;

document.getElementById("result").innerText=
"✅ Correct +10 XP | Combo: "+combo;

avatar("correct");

/* combo bonus */
if(combo%3===0){
xp+=20;
document.getElementById("result").innerText+=" 🔥 COMBO BONUS!";
}

}else{

combo=0;
energy-=15;

document.getElementById("result").innerText=
"❌ Wrong | Energy: "+energy;

avatar("wrong");

}

/* GAME OVER */
if(energy<=0){
alert("💀 Game Over Restarting");
xp=0;
energy=100;
combo=0;
}

/* UPDATE */
update();
load();

}

/* ===== UI ===== */
function update(){

document.getElementById("xp").innerText=xp;
document.getElementById("level").innerText=Math.floor(xp/50)+1;
document.getElementById("energy").innerText=energy;

/* XP BAR */
let bar=(xp%50)*2;
document.getElementById("bar").style.width=bar+"%";

}

/* START */
load();
update();

</script>

</body>
</html>
