<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeoulQuest AI - Ultimate</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(to bottom,#020617,#0f172a,#000);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.game{
width:92%;
max-width:850px;
background:rgba(15,23,42,0.95);
padding:20px;
border-radius:20px;
text-align:center;
border:1px solid #334155;
}

h1{color:#38bdf8;}

.top{
display:flex;
justify-content:space-between;
font-size:14px;
margin-bottom:10px;
}

.bar{
width:100%;
height:10px;
background:#1e293b;
border-radius:10px;
overflow:hidden;
margin-bottom:10px;
}

.fill{
height:100%;
background:linear-gradient(90deg,#38bdf8,#0ea5e9);
width:0%;
transition:0.3s;
}

.q{
font-size:20px;
margin:15px 0;
}

.btn{
display:block;
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
cursor:pointer;
}

.btn:hover{background:#2563eb}

/* NEW UI */
.badges{
margin-top:10px;
color:#facc15;
font-weight:bold;
}

.stats{
font-size:13px;
margin-top:10px;
color:#94a3b8;
}
</style>
</head>

<body>

<div class="game">

<h1>🎮 SeoulQuest AI</h1>

<div>
<button class="btn" onclick="setMode('daily')">🏠 Daily</button>
<button class="btn" onclick="setMode('restaurant')">🍜 Restaurant</button>
<button class="btn" onclick="setMode('travel')">✈️ Travel</button>
<button class="btn" onclick="setMode('shopping')">🛍️ Shopping</button>
</div>

<div class="top">
<div>XP: <span id="xp">0</span></div>
<div>Level: <span id="level">1</span></div>
<div>Energy: <span id="energy">100</span></div>
</div>

<div class="bar">
<div class="fill" id="bar"></div>
</div>

<div class="q" id="question"></div>
<div id="options"></div>
<div id="result"></div>

<!-- NEW FEATURES -->
<div class="badges" id="badges">🏅 No Badge Yet</div>
<div class="stats" id="stats"></div>

</div>

<script>

/* CORE */
let xp=0;
let energy=100;
let mode="daily";

let correct=0;
let wrong=0;
let streak=0;

/* BADGES */
let badge="None";

/* DATA (UNCHANGED + SAFE) */
const data = {

daily:[
["I am a student","저는 학생입니다"],
["I am learning Korean","저는 한국어를 배우고 있습니다"],
["I go to school","저는 학교에 갑니다"],
["I like studying","저는 공부를 좋아합니다"],
["I am happy","저는 행복합니다"]
],

restaurant:[
["Menu please","메뉴 주세요"],
["I am hungry","배고파요"],
["Check please","계산해 주세요"],
["Water please","물 주세요"],
["It is delicious","맛있어요"]
],

travel:[
["Where is station","역 어디예요"],
["I am lost","길을 잃었어요"],
["I need help","도와 주세요"],
["Where is hotel","호텔 어디예요"],
["I arrived","도착했습니다"]
],

shopping:[
["How much is this","이거 얼마예요"],
["I want this","이거 주세요"],
["Discount please","할인 있어요"],
["I will buy","살게요"],
["It is expensive","비싸요"]
]

};

/* MODE */
function setMode(m){
mode=m;
load();
}

/* GENERATE */
function gen(){
let list=data[mode];
let item=list[Math.floor(Math.random()*list.length)];

let wrong=list
.filter(x=>x[1]!==item[1])
.sort(()=>Math.random()-0.5)
.slice(0,3)
.map(x=>x[1]);

return {
q:item[0],
a:item[1],
o:[...wrong,item[1]].sort(()=>Math.random()-0.5)
};
}

/* LOAD */
function load(){

let g=gen();
currentAnswer=g.a;

document.getElementById("question").innerText=g.q;

let html="";
g.o.forEach(op=>{
html+=`<button class="btn" onclick="check('${op}')">${op}</button>`;
});

document.getElementById("options").innerHTML=html;
}

/* CHECK */
function check(ans){

if(ans===currentAnswer){
xp+=10;
correct++;
streak++;

document.getElementById("result").innerText="✅ Correct +10 XP";

}else{
energy-=10;
wrong++;
streak=0;

document.getElementById("result").innerText="❌ Wrong";
}

/* LEVEL */
let level=Math.floor(xp/50)+1;

/* BADGES SYSTEM */
if(correct>=50){
badge="💎 MASTER";
}
else if(correct>=25){
badge="🥇 SCHOLAR";
}
else if(correct>=10){
badge="🥈 LEARNER";
}
else if(correct>=1){
badge="🥉 STARTER";
}

/* GAME OVER */
if(energy<=0){
alert("Game Over Restarting");
xp=0;
energy=100;
correct=0;
wrong=0;
streak=0;
badge="None";
}

/* UPDATE UI */
update(level);
load();
}

/* UPDATE */
function update(level){

document.getElementById("xp").innerText=xp;
document.getElementById("level").innerText=level;
document.getElementById("energy").innerText=energy;

document.getElementById("bar").style.width=(xp%50)*2+"%";

/* BADGE UI */
document.getElementById("badges").innerText="🏅 Badge: "+badge;

/* STATS */
let accuracy = correct+wrong===0 ? 0 : Math.round((correct/(correct+wrong))*100);

document.getElementById("stats").innerText=
`Correct: ${correct} | Wrong: ${wrong} | Accuracy: ${accuracy}% | Streak: ${streak}`;
}

/* START */
load();
update(1);

</script>

</body>
</html>
