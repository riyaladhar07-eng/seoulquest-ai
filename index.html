<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeoulQuest AI</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(to bottom,#020617,#0f172a,#000);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.game{
width:92%;
max-width:800px;
background:rgba(15,23,42,0.95);
padding:20px;
border-radius:20px;
text-align:center;
border:1px solid #334155;
}

h1{color:#38bdf8;}

.top{
display:flex;
justify-content:space-between;
font-size:14px;
margin:10px 0;
}

.btn{
display:block;
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
cursor:pointer;
transition:0.2s;
}

.btn:hover{
background:#2563eb;
transform:scale(1.02);
}

#box{
margin-top:10px;
}

#result{
margin-top:10px;
min-height:20px;
color:#67e8f9;
}
</style>
</head>

<body>

<div class="game">

<h1>🎮 SeoulQuest AI</h1>

<div class="top">
<div>XP: <span id="xp">0</span></div>
<div>Level: <span id="level">1</span></div>
<div>Energy: <span id="energy">100</span></div>
</div>

<h3>🎭 Role Play Mode</h3>

<div id="box"></div>
<div id="result"></div>

</div>

<script>

/* ================= CORE ================= */
let xp = 0;
let energy = 100;
let currentScenario = "";
let currentIndex = 0;

/* ================= SCENARIOS ================= */

const scenarios = {

airport: [
{
q: "✈️ Airport: Officer asks → 'What is your name?'",
options: ["저는 리야입니다", "감사합니다", "안녕하세요", "물"],
answer: "저는 리야입니다"
},
{
q: "✈️ Officer: 'Where are you going?'",
options: ["한국에 갑니다", "학교", "사랑", "커피"],
answer: "한국에 갑니다"
},
{
q: "✈️ Officer: 'Show your passport'",
options: ["여기 있습니다", "안녕하세요", "친구", "책"],
answer: "여기 있습니다"
}
],

restaurant: [
{
q: "🍜 Waiter: 'What would you like to order?'",
options: ["비빔밥 주세요", "안녕하세요", "학교 갑니다", "친구"],
answer: "비빔밥 주세요"
},
{
q: "🍜 Waiter: 'Drink?'",
options: ["물 주세요", "책", "서울", "게임"],
answer: "물 주세요"
},
{
q: "🍜 After eating: 'It was delicious'",
options: ["맛있었습니다", "감사합니다", "안녕하세요", "학교"],
answer: "맛있었습니다"
}
],

friend: [
{
q: "👋 Friend: 'Hi! What is your name?'",
options: ["저는 리야입니다", "감사합니다", "물", "학교"],
answer: "저는 리야입니다"
},
{
q: "👋 Friend: 'Where are you from?'",
options: ["인도에서 왔어요", "비빔밥", "책", "서울"],
answer: "인도에서 왔어요"
},
{
q: "👋 Friend: 'Nice to meet you!'",
options: ["만나서 반갑습니다", "물 주세요", "학교", "커피"],
answer: "만나서 반갑습니다"
}
],

shopping: [
{
q: "🛍️ Shop: 'How can I help you?'",
options: ["이거 얼마예요?", "안녕하세요", "학교", "물"],
answer: "이거 얼마예요?"
},
{
q: "🛍️ Shop: '10,000 won'",
options: ["여기요", "친구", "서울", "책"],
answer: "여기요"
},
{
q: "🛍️ After buying?",
options: ["감사합니다", "학교", "커피", "집"],
answer: "감사합니다"
}
]

};

/* ================= MENU ================= */

function menu(){
currentIndex = 0;

document.getElementById("box").innerHTML = `
<button class="btn" onclick="start('airport')">✈️ Airport</button>
<button class="btn" onclick="start('restaurant')">🍜 Restaurant</button>
<button class="btn" onclick="start('friend')">👋 Friend</button>
<button class="btn" onclick="start('shopping')">🛍️ Shopping</button>
`;

document.getElementById("result").innerText = "";
}

/* ================= START ================= */

function start(type){
currentScenario = type;
currentIndex = 0;
load();
}

/* ================= LOAD ================= */

function load(){

let s = scenarios[currentScenario][currentIndex];

let html = `<h3>${s.q}</h3>`;

s.options.forEach(op=>{
html += `<button class="btn" onclick="check('${op}')">${op}</button>`;
});

document.getElementById("box").innerHTML = html;
document.getElementById("result").innerText = "";
}

/* ================= CHECK ================= */

function check(ans){

let s = scenarios[currentScenario][currentIndex];

if(ans === s.answer){
xp += 10;
document.getElementById("result").innerText = "✅ Correct +10 XP";
} else {
energy -= 10;
document.getElementById("result").innerText = "❌ Wrong -10 Energy";
}

update();

currentIndex++;

setTimeout(()=>{

if(currentIndex >= scenarios[currentScenario].length){
menu();
} else {
load();
}

},1000);

}

/* ================= UI ================= */

function update(){

document.getElementById("xp").innerText = xp;
document.getElementById("level").innerText = Math.floor(xp/50)+1;
document.getElementById("energy").innerText = energy;

}

/* START */
menu();
update();

</script>

</body>
</html>
